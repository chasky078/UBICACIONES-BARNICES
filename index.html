<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#164f83">
<title>CONTROL DE BARNICES</title>

<style>
:root {
    --azul: #164f83;
    --azul-oscuro: #10375e;
    --azul-claro: #e5effb;
    --borde: #c7d7e8;
    --rojo: #e5232e;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 12px;
    background: #edf2f7;
    color: #20364f;
    font-family: Arial, Helvetica, sans-serif;
}

.app {
    max-width: 850px;
    margin: auto;
    background: #fff;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 5px 22px rgba(15, 45, 80, .12);
}

.cabecera {
    padding: 20px;
    background: linear-gradient(120deg, #164778, #17699d);
    color: white;
}

.cabecera-superior {
    display: flex;
    align-items: center;
    gap: 17px;
}

.logo-contenedor {
    width: 145px;
    min-width: 100px;
    height: 85px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-right: 3px solid rgba(255,255,255,.65);
    padding-right: 14px;
}

.logo {
    display: block;
    max-width: 100%;
    max-height: 75px;
    object-fit: contain;
    background: white;
    border-radius: 4px;
}

.titulos {
    flex: 1;
    min-width: 0;
}

.titulos h1 {
    margin: 0;
    font-size: clamp(19px, 4vw, 29px);
    font-weight: 900;
    line-height: 1.2;
}

.titulos p {
    margin: 7px 0 0;
    font-size: clamp(11px, 2.5vw, 16px);
    font-weight: bold;
}

.firma {
    margin-top: 12px;
    text-align: right;
    color: #c4e1ff;
    font-size: 12px;
    font-weight: bold;
}

.contenido {
    padding: 16px;
}

.fecha {
    margin-bottom: 16px;
    padding: 12px;
    border: 1px solid var(--borde);
    border-radius: 8px;
    background: #f5f9fe;
}

.fecha label {
    display: block;
    margin-bottom: 7px;
    font-size: 12px;
    font-weight: 900;
}

.fecha input {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--borde);
    border-radius: 6px;
    font-family: inherit;
    font-size: 15px;
}

.titulo-registro {
    margin: 18px 0 14px;
    color: var(--azul);
    font-size: 25px;
    font-weight: 900;
}

.fotos {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin: 15px 0;
}

.foto {
    display: block;
    width: 100%;
    height: 115px;
    object-fit: cover;
    object-position: center;
    border: 1px solid var(--borde);
    border-radius: 5px;
    background: #f1f5fa;
}

.tabla-contenedor {
    width: 100%;
    overflow-x: auto;
    border: 2px solid var(--azul);
    border-radius: 5px;
}

table {
    width: 100%;
    min-width: 310px;
    border-collapse: collapse;
    table-layout: fixed;
}

.col-descripcion {
    width: 56%;
}

.col-aviso {
    width: 15%;
}

.col-ubicacion {
    width: 29%;
}

thead th {
    padding: 13px 4px;
    background: var(--azul-claro);
    color: #214a75;
    font-size: 11px;
    font-weight: 900;
    line-height: 1.35;
    text-align: center;
    overflow-wrap: anywhere;
    border-bottom: 3px solid var(--azul);
}

/* Separadores verticales visibles entre las tres columnas. */
th + th,
td + td {
    border-left: 3px solid var(--azul);
}

tbody td {
    height: 57px;
    padding: 4px;
    border-bottom: 1px solid var(--borde);
    background: white;
}

tbody tr:nth-child(even) td {
    background: #f5f8fc;
}

tbody tr:last-child td {
    border-bottom: 0;
}

.campo-barniz {
    width: 100%;
    min-width: 0;
    padding: 10px 5px;
    border: 1px solid #d5e0ed;
    border-radius: 4px;
    background: #fff;
    color: #20364f;
    font-family: inherit;
    font-size: 14px;
}

.campo-barniz:focus,
.campo-numero:focus {
    outline: 2px solid #80b8ee;
    outline-offset: -2px;
}

.celda-aviso {
    text-align: center;
    padding: 3px !important;
}

.marcador {
    width: 35px;
    height: 35px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid #c3cfdd;
    border-radius: 50%;
    background: white;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

.punto {
    display: block;
    width: 19px;
    height: 19px;
    border: 2px solid #b8c5d4;
    border-radius: 50%;
    background: white;
}

.marcador.activo .punto {
    border-color: #c51620;
    background: var(--rojo);
}

.ubicacion {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
}

.prefijo {
    flex: 0 0 auto;
    font-size: 13px;
    font-weight: 900;
    color: var(--azul);
}

.campo-numero {
    width: 100%;
    min-width: 0;
    padding: 10px 1px;
    border: 1px solid #d5e0ed;
    border-radius: 4px;
    text-align: center;
    font-family: inherit;
    font-size: 14px;
    font-weight: bold;
    color: #20364f;
    background: white;
}

.leyenda {
    margin: 16px 0;
    padding: 13px;
    border: 1px solid #efb7bb;
    border-left: 5px solid var(--rojo);
    border-radius: 5px;
    background: #fff7f7;
    font-size: 12px;
    line-height: 1.55;
}

.leyenda strong {
    display: block;
    margin-bottom: 4px;
    color: #b51c25;
    font-size: 13px;
}

.botones {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
    margin: 18px 0;
}

.boton {
    min-height: 47px;
    padding: 11px 7px;
    border: 0;
    border-radius: 9px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 900;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

.boton-azul {
    background: var(--azul);
    color: white;
}

.boton-claro {
    background: #e7eff8;
    color: #214a75;
}

.boton-rojo {
    background: #fff0f0;
    color: #b51c25;
}

.boton:disabled {
    opacity: .6;
}

.pie {
    padding: 15px 8px;
    border-top: 1px solid #e0e6ee;
    background: #f8fafc;
    color: #718196;
    font-size: 12px;
    text-align: center;
}

@media (max-width: 420px) {
    body {
        padding: 6px;
    }

    .cabecera {
        padding: 14px 10px;
    }

    .cabecera-superior {
        gap: 10px;
    }

    .logo-contenedor {
        width: 100px;
        min-width: 90px;
        height: 72px;
        padding-right: 8px;
    }

    .logo {
        max-height: 62px;
    }

    .contenido {
        padding: 10px;
    }

    .titulo-registro {
        font-size: 21px;
    }

    .foto {
        height: 100px;
    }

    .marcador {
        width: 30px;
        height: 30px;
    }

    .punto {
        width: 17px;
        height: 17px;
    }

    .campo-barniz,
    .campo-numero {
        font-size: 12px;
    }

    .boton {
        font-size: 11px;
    }
}
</style>
</head>

<body>

<div class="app" id="aplicacion">

    <header class="cabecera">

        <div class="cabecera-superior">

            <div class="logo-contenedor">
                <img
                    id="logoSonoco"
                    class="logo"
                    src="./IMG_5518.jpeg"
                    alt="Logo SONOCO"
                >
            </div>

            <div class="titulos">
                <h1>CONTROL DE BARNICES</h1>
                <p>REGISTRO DE UBICACIONES</p>
            </div>

        </div>

        <div class="firma">By Rubén D. 268</div>

    </header>

    <main class="contenido">

        <div class="fecha">
            <label for="fechaRegistro">FECHA DEL REGISTRO</label>
            <input type="datetime-local" id="fechaRegistro">
        </div>

        <h2 class="titulo-registro">REGISTRO DE BARNICES</h2>

        <!-- Fotografía superior -->
        <div class="fotos">
            <img
                class="foto"
                src="./IMG_5503.jpeg"
                alt="Fotografía superior de referencia"
            >
        </div>

        <div class="tabla-contenedor">

            <table>
                <colgroup>
                    <col class="col-descripcion">
                    <col class="col-aviso">
                    <col class="col-ubicacion">
                </colgroup>

                <thead>
                    <tr>
                        <th>DESCRIPCIÓN / BARNIZ</th>
                        <th>AVISO</th>
                        <th>UBICACIÓN</th>
                    </tr>
                </thead>

                <tbody id="filasBarnices"></tbody>

            </table>

        </div>

        <div class="leyenda">
            <strong>🔴 AVISO DE TRASVASE</strong>
            Marca con el símbolo rojo los barnices que requieren un
            trasvase de producto debido a su bajo nivel de contenido.
        </div>

        <div class="botones">

            <button class="boton boton-azul" id="anadirFila" type="button">
                + AÑADIR FILA
            </button>

            <button class="boton boton-claro" id="compartirRegistro" type="button">
                COMPARTIR REGISTRO
            </button>

            <button class="boton boton-claro" id="guardarImagen" type="button">
                GUARDAR IMAGEN
            </button>

            <button class="boton boton-rojo" id="limpiarRegistro" type="button">
                LIMPIAR REGISTRO
            </button>

        </div>

        <!-- Fotografía inferior -->
        <div class="fotos">
            <img
                class="foto"
                src="./IMG_5504.jpeg"
                alt="Fotografía inferior de referencia"
            >
        </div>

    </main>

    <footer class="pie">
        CONTROL DE BARNICES · SONOCO
    </footer>

</div>

<script>
"use strict";

/* UBICACIONES AUTOMÁTICAS DE LOS BARNICES CONOCIDOS */
const ubicaciones = {
    "814449": "W02008",
    "MKB113T": "W02009",
    "818083": "W02007",
    "110496": "W02010",
    "DISOLVENTE": "W02006",
    "MKW1301T": "W02005",
    "450148": "W02004",
    "816621": "W02003",
    "814509": "W02002"
};

const tbody = document.getElementById("filasBarnices");
const campoFecha = document.getElementById("fechaRegistro");

function fechaHoraLocal() {
    const ahora = new Date();
    const offset = ahora.getTimezoneOffset() * 60000;
    return new Date(ahora.getTime() - offset)
        .toISOString()
        .slice(0, 16);
}

campoFecha.value = fechaHoraLocal();

function normalizar(texto) {
    return String(texto || "")
        .trim()
        .toUpperCase()
        .replace(/[.\s-]/g, "");
}

function crearFila() {
    const tr = document.createElement("tr");

    const tdDescripcion = document.createElement("td");
    const descripcion = document.createElement("input");

    descripcion.type = "text";
    descripcion.className = "campo-barniz";
    descripcion.placeholder = "Barniz...";
    descripcion.autocomplete = "off";
    descripcion.setAttribute("aria-label", "Descripción del barniz");

    tdDescripcion.appendChild(descripcion);

    const tdAviso = document.createElement("td");
    tdAviso.className = "celda-aviso";

    const botonAviso = document.createElement("button");
    botonAviso.type = "button";
    botonAviso.className = "marcador";
    botonAviso.setAttribute("aria-label", "Marcar aviso de trasvase");
    botonAviso.setAttribute("aria-pressed", "false");

    const punto = document.createElement("span");
    punto.className = "punto";

    botonAviso.appendChild(punto);
    tdAviso.appendChild(botonAviso);

    const tdUbicacion = document.createElement("td");

    const contenedorUbicacion = document.createElement("div");
    contenedorUbicacion.className = "ubicacion";

    const prefijo = document.createElement("span");
    prefijo.className = "prefijo";

    const numero = document.createElement("input");
    numero.type = "text";
    numero.inputMode = "numeric";
    numero.autocomplete = "off";
    numero.className = "campo-numero";
    numero.placeholder = "N.º";
    numero.setAttribute("aria-label", "Número de ubicación");

    contenedorUbicacion.appendChild(prefijo);
    contenedorUbicacion.appendChild(numero);
    tdUbicacion.appendChild(contenedorUbicacion);

    tr.appendChild(tdDescripcion);
    tr.appendChild(tdAviso);
    tr.appendChild(tdUbicacion);

    tbody.appendChild(tr);

    function actualizarUbicacion() {
        const texto = descripcion.value.trim();

        if (!texto) {
            prefijo.textContent = "";
            numero.value = "";
            return;
        }

        const clave = normalizar(texto);
        const conocida = ubicaciones[clave];

        if (conocida) {
            prefijo.textContent = conocida.charAt(0);
            numero.value = conocida.slice(1);
        } else {
            prefijo.textContent = "A";
            numero.value = numero.value.replace(/\D/g, "");
        }
    }

    descripcion.addEventListener("input", actualizarUbicacion);

    numero.addEventListener("input", function() {
        const clave = normalizar(descripcion.value);

        if (ubicaciones[clave]) {
            const conocida = ubicaciones[clave];
            prefijo.textContent = conocida.charAt(0);
            numero.value = conocida.slice(1);
        } else {
            numero.value = numero.value.replace(/\D/g, "");
        }
    });

    botonAviso.addEventListener("click", function() {
        const activo = botonAviso.classList.toggle("activo");

        botonAviso.setAttribute("aria-pressed", String(activo));
        botonAviso.setAttribute(
            "aria-label",
            activo ? "Quitar aviso de trasvase" : "Marcar aviso de trasvase"
        );
    });

    return tr;
}

function filasActuales() {
    return Array.from(tbody.querySelectorAll("tr"));
}

document.getElementById("anadirFila").addEventListener("click", function() {
    const fila = crearFila();
    fila.querySelector(".campo-barniz").focus();
});

document.getElementById("limpiarRegistro").addEventListener("click", function() {
    if (!confirm("¿Quieres borrar todas las filas y empezar un registro nuevo?")) {
        return;
    }

    tbody.innerHTML = "";

    for (let i = 0; i < 4; i++) {
        crearFila();
    }

    campoFecha.value = fechaHoraLocal();
});

function cargarImagen(src) {
    return new Promise(function(resolve) {
        const imagen = new Image();

        imagen.onload = function() {
            resolve(imagen);
        };

        imagen.onerror = function() {
            resolve(null);
        };

        imagen.src = src;
    });
}

function dibujarFoto(ctx, imagen, x, y, ancho, alto) {
    ctx.fillStyle = "#eef3f8";
    ctx.fillRect(x, y, ancho, alto);

    if (!imagen) {
        ctx.fillStyle = "#5b6f85";
        ctx.font = "18px Arial";
        ctx.textAlign = "center";
        ctx.fillText("Fotografía no disponible", x + ancho / 2, y + alto / 2);
        return;
    }

    const escala = Math.max(ancho / imagen.width, alto / imagen.height);
    const anchoOrigen = ancho / escala;
    const altoOrigen = alto / escala;
    const sx = (imagen.width - anchoOrigen) / 2;
    const sy = (imagen.height - altoOrigen) / 2;

    ctx.drawImage(
        imagen,
        sx, sy, anchoOrigen, altoOrigen,
        x, y, ancho, alto
    );
}

async function generarImagen() {
    const logo = await cargarImagen("./IMG_5518.jpeg");
    const fotoSuperior = await cargarImagen("./IMG_5503.jpeg");
    const fotoInferior = await cargarImagen("./IMG_5504.jpeg");

    const lista = filasActuales().map(function(tr) {
        return {
            descripcion: tr.querySelector(".campo-barniz").value.trim(),
            prefijo: tr.querySelector(".prefijo").textContent,
            numero: tr.querySelector(".campo-numero").value.trim(),
            aviso: tr.querySelector(".marcador").classList.contains("activo")
        };
    });

    const W = 1200;
    const M = 45;
    const IW = W - M * 2;
    const altoCabecera = 155;
    const altoFoto = 125;
    const altoFecha = 55;
    const altoTH = 60;
    const altoFila = 65;
    const altoLeyenda = 95;

    const H =
        M + altoCabecera + 22 +
        altoFecha + 20 +
        55 + altoFoto + 15 +
        altoTH + lista.length * altoFila +
        20 + altoLeyenda + 20 +
        altoFoto + M;

    const canvas = document.createElement("canvas");
    canvas.width = W;
    canvas.height = H;

    const ctx = canvas.getContext("2d");

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, W, H);

    let y = M;

    /* CABECERA */
    const gradiente = ctx.createLinearGradient(0, y, W, y + altoCabecera);
    gradiente.addColorStop(0, "#164778");
    gradiente.addColorStop(1, "#17699d");

    ctx.fillStyle = gradiente;
    ctx.fillRect(0, y, W, altoCabecera);

    /* LOGO ORIGINAL */
    if (logo) {
        const cajaX = M;
        const cajaY = y + 28;
        const cajaW = 205;
        const cajaH = 92;

        ctx.fillStyle = "#ffffff";
        ctx.fillRect(cajaX, cajaY, cajaW, cajaH);

        const escala = Math.min(
            (cajaW - 12) / logo.width,
            (cajaH - 12) / logo.height
        );

        const lw = logo.width * escala;
        const lh = logo.height * escala;

        ctx.drawImage(
            logo,
            cajaX + (cajaW - lw) / 2,
            cajaY + (cajaH - lh) / 2,
            lw,
            lh
        );
    } else {
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 30px Arial";
        ctx.textAlign = "center";
        ctx.fillText("SONOCO", M + 102, y + 82);
    }

    ctx.fillStyle = "#ffffff";
    ctx.textAlign = "left";
    ctx.font = "bold 39px Arial";
    ctx.fillText("CONTROL DE BARNICES", M + 225, y + 65);

    ctx.font = "bold 23px Arial";
    ctx.fillText("REGISTRO DE UBICACIONES", M + 225, y + 100);

    ctx.fillStyle = "#c4e1ff";
    ctx.font = "bold 18px Arial";
    ctx.fillText("By Rubén D. 268", M + 225, y + 132);

    y += altoCabecera + 22;

    /* FECHA Y HORA */
    ctx.fillStyle = "#f5f9fe";
    ctx.fillRect(M, y, IW, altoFecha);

    ctx.strokeStyle = "#c7d7e8";
    ctx.lineWidth = 2;
    ctx.strokeRect(M, y, IW, altoFecha);

    const fecha = campoFecha.value
        ? campoFecha.value.replace("T", " ")
        : fechaHoraLocal().replace("T", " ");

    ctx.fillStyle = "#526b85";
    ctx.textAlign = "left";
    ctx.font = "bold 22px Arial";
    ctx.fillText("FECHA DEL REGISTRO: " + fecha, M + 15, y + 35);

    y += altoFecha + 20;

    /* TÍTULO */
    ctx.fillStyle = "#164f83";
    ctx.font = "bold 31px Arial";
    ctx.fillText("REGISTRO DE BARNICES", M, y + 35);

    y += 55;

    /* FOTO SUPERIOR */
    dibujarFoto(ctx, fotoSuperior, M, y, IW, altoFoto);
    ctx.strokeStyle = "#c7d7e8";
    ctx.strokeRect(M, y, IW, altoFoto);

    y += altoFoto + 15;

    /* TABLA */
    const anchoDescripcion = Math.round(IW * .56);
    const anchoAviso = Math.round(IW * .15);
    const anchoUbicacion = IW - anchoDescripcion - anchoAviso;

    const xAviso = M + anchoDescripcion;
    const xUbicacion = xAviso + anchoAviso;

    ctx.fillStyle = "#e5effb";
    ctx.fillRect(M, y, IW, altoTH);

    ctx.strokeStyle = "#164f83";
    ctx.lineWidth = 3;
    ctx.strokeRect(M, y, IW, altoTH);

    ctx.beginPath();
    ctx.moveTo(xAviso, y);
    ctx.lineTo(xAviso, y + altoTH);
    ctx.moveTo(xUbicacion, y);
    ctx.lineTo(xUbicacion, y + altoTH);
    ctx.stroke();

    ctx.fillStyle = "#214a75";
    ctx.textAlign = "center";
    ctx.font = "bold 19px Arial";

    ctx.fillText(
        "DESCRIPCIÓN / BARNIZ",
        M + anchoDescripcion / 2,
        y + 36
    );

    ctx.fillText(
        "AVISO",
        xAviso + anchoAviso / 2,
        y + 36
    );

    ctx.fillText(
        "UBICACIÓN",
        xUbicacion + anchoUbicacion / 2,
        y + 36
    );

    y += altoTH;

    lista.forEach(function(fila, i) {
        ctx.fillStyle = i % 2 === 0 ? "#ffffff" : "#f5f8fc";
        ctx.fillRect(M, y, IW, altoFila);

        ctx.strokeStyle = "#c7d7e8";
        ctx.lineWidth = 1;
        ctx.strokeRect(M, y, IW, altoFila);

        /* DIVISIONES AZULES */
        ctx.strokeStyle = "#164f83";
        ctx.lineWidth = 3;

        ctx.beginPath();
        ctx.moveTo(xAviso, y);
        ctx.lineTo(xAviso, y + altoFila);
        ctx.moveTo(xUbicacion, y);
        ctx.lineTo(xUbicacion, y + altoFila);
        ctx.stroke();

        /* DESCRIPCIÓN */
        ctx.fillStyle = "#20364f";
        ctx.textAlign = "left";
        ctx.font = "21px Arial";

        let texto = fila.descripcion;
        const maxAncho = anchoDescripcion - 24;

        while (texto && ctx.measureText(texto).width > maxAncho) {
            texto = texto.slice(0, -1);
        }

        if (texto.length < fila.descripcion.length && texto.length > 2) {
            texto = texto.slice(0, -1) + "…";
        }

        ctx.fillText(texto, M + 12, y + 40);

        /* CÍRCULO DE AVISO ROJO */
        const cx = xAviso + anchoAviso / 2;
        const cy = y + altoFila / 2;

        ctx.beginPath();
        ctx.arc(cx, cy, 15, 0, Math.PI * 2);

        ctx.fillStyle = fila.aviso ? "#e5232e" : "#ffffff";
        ctx.fill();

        ctx.strokeStyle = fila.aviso ? "#c51620" : "#b8c5d4";
        ctx.lineWidth = 3;
        ctx.stroke();

        /* UBICACIÓN */
        ctx.fillStyle = "#164f83";
        ctx.textAlign = "center";
        ctx.font = "bold 23px Arial";

        ctx.fillText(
            fila.prefijo + fila.numero,
            xUbicacion + anchoUbicacion / 2,
            y + 40
        );

        y += altoFila;
    });

    y += 20;

    /* LEYENDA */
    ctx.fillStyle = "#fff7f7";
    ctx.fillRect(M, y, IW, altoLeyenda);

    ctx.strokeStyle = "#e5232e";
    ctx.lineWidth = 3;
    ctx.strokeRect(M, y, IW, altoLeyenda);

    ctx.fillStyle = "#b51c25";
    ctx.textAlign = "left";
    ctx.font = "bold 22px Arial";
    ctx.fillText("AVISO DE TRASVASE", M + 15, y + 31);

    ctx.fillStyle = "#20364f";
    ctx.font = "18px Arial";
    ctx.fillText(
        "Marca con el símbolo rojo los barnices que requieren un",
        M + 15,
        y + 57
    );
    ctx.fillText(
        "trasvase de producto debido a su bajo nivel de contenido.",
        M + 15,
        y + 81
    );

    y += altoLeyenda + 20;

    /* FOTO INFERIOR */
    dibujarFoto(ctx, fotoInferior, M, y, IW, altoFoto);

    ctx.strokeStyle = "#c7d7e8";
    ctx.strokeRect(M, y, IW, altoFoto);

    return new Promise(function(resolve, reject) {
        canvas.toBlob(function(blob) {
            if (blob) {
                resolve(blob);
            } else {
                reject(new Error("No se pudo generar la imagen."));
            }
        }, "image/png");
    });
}

function nombreArchivo() {
    return "CONTROL-BARNICES-" +
        (campoFecha.value || fechaHoraLocal()).slice(0, 10) +
        ".png";
}

function descargar(blob) {
    const url = URL.createObjectURL(blob);
    const enlace = document.createElement("a");

    enlace.href = url;
    enlace.download = nombreArchivo();

    document.body.appendChild(enlace);
    enlace.click();
    enlace.remove();

    setTimeout(function() {
        URL.revokeObjectURL(url);
    }, 5000);
}

document.getElementById("guardarImagen").addEventListener("click", async function() {
    try {
        const blob = await generarImagen();
        descargar(blob);
    } catch (error) {
        alert("No se pudo generar la imagen. Comprueba que las fotos y el logo estén en GitHub.");
        console.error(error);
    }
});

document.getElementById("compartirRegistro").addEventListener("click", async function() {
    try {
        const blob = await generarImagen();

        const archivo = new File(
            [blob],
            nombreArchivo(),
            { type: "image/png" }
        );

        if (
            navigator.share &&
            navigator.canShare &&
            navigator.canShare({ files: [archivo] })
        ) {
            await navigator.share({
                title: "Control de barnices",
                text: "Registro de ubicaciones de barnices.",
                files: [archivo]
            });
        } else {
            descargar(blob);
            alert("La imagen se ha descargado. Después podrás compartirla por WhatsApp.");
        }
    } catch (error) {
        if (error.name !== "AbortError") {
            alert("No se pudo compartir la imagen. Prueba con GUARDAR IMAGEN.");
            console.error(error);
        }
    }
});

/* INICIALIZAR CUATRO FILAS */
for (let i = 0; i < 4; i++) {
    crearFila();
}
</script>
