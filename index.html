<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#194f7d">
<title>CONTROL DE BARNICES - SONOCO</title>

<style>
:root {
    --azul: #194f7d;
    --azul2: #216c9b;
    --azul-claro: #e7f0fa;
    --borde: #d1dce8;
    --rojo: #d71930;
    --texto: #243447;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 10px 6px 24px;
    background: #edf2f8;
    color: var(--texto);
    font-family: Arial, Helvetica, sans-serif;
}

.app {
    width: 100%;
    max-width: 760px;
    margin: auto;
    overflow: hidden;
    background: white;
    border-radius: 15px;
    box-shadow: 0 4px 18px rgba(20,55,85,.10);
}

/* CABECERA */

.cabecera {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 14px;
    color: white;
    background: linear-gradient(120deg,#174a76,#216c9b);
}

.logo {
    display: block;
    width: 86px;
    max-width: 29%;
    height: auto;
    max-height: 90px;
    object-fit: contain;
    background: white;
    border-radius: 5px;
    padding: 3px;
}

.separador {
    align-self: stretch;
    width: 2px;
    min-width: 2px;
    background: rgba(255,255,255,.65);
}

.titulos {
    flex: 1;
    min-width: 0;
}

.titulos h1 {
    margin: 0 0 6px;
    font-size: clamp(18px,4.4vw,29px);
    line-height: 1.12;
}

.titulos p {
    margin: 0;
    font-size: clamp(11px,2.9vw,16px);
    line-height: 1.3;
}

.firma {
    margin-top: 9px;
    text-align: right;
    color: #d0e1f1;
    font-size: 12px;
    font-weight: bold;
}

/* CONTENIDO */

.contenido {
    padding: 12px;
}

.fecha-caja {
    margin-bottom: 12px;
    padding: 10px 6px;
    border: 1.5px solid var(--borde);
    border-radius: 9px;
    background: #f5f8fc;
    text-align: center;
}

.fecha {
    color: var(--azul);
    font-size: 17px;
    font-weight: bold;
}

.hora {
    margin-top: 4px;
    color: #526579;
    font-size: 14px;
}

/* FOTOGRAFÍAS COMPACTAS */

.foto {
    display: block;
    width: 100%;
    height: 88px;
    margin: 0 0 13px;
    border: 1.5px solid #d6e0eb;
    border-radius: 7px;
    object-fit: cover;
}

.foto-inferior {
    margin: 16px 0 0;
}

/* TABLA */

.tabla-contenedor {
    width: 100%;
    margin-bottom: 13px;
    overflow: hidden;
    border: 2px solid var(--azul);
    border-radius: 7px;
}

.tabla {
    width: 100%;
    table-layout: fixed;
    border-collapse: collapse;
}

.col-descripcion {
    width: 57%;
}

.col-aviso {
    width: 13%;
}

.col-ubicacion {
    width: 30%;
}

.tabla th {
    padding: 10px 2px;
    background: var(--azul-claro);
    color: #24496d;
    font-size: 11px;
    font-weight: 800;
    line-height: 1.25;
    text-align: center;
    overflow-wrap: anywhere;
    border-right: 3px solid var(--azul);
    border-bottom: 3px solid var(--azul);
}

.tabla th:last-child {
    border-right: none;
}

.tabla td {
    height: 69px;
    padding: 5px 4px;
    vertical-align: middle;
    background: white;
    border-right: 4px solid var(--azul);
    border-bottom: 1.5px solid var(--borde);
}

.tabla td:last-child {
    border-right: none;
}

.tabla tr:last-child td {
    border-bottom: none;
}

.entrada {
    display: block;
    width: 100%;
    min-width: 0;
    height: 39px;
    padding: 5px;
    border: 1.5px solid #d6e0eb;
    border-radius: 6px;
    outline: none;
    background: white;
    color: var(--texto);
    font-family: Arial, Helvetica, sans-serif;
    font-size: 14px;
}

.entrada:focus {
    border-color: #3980b8;
}

.descripcion {
    text-transform: uppercase;
}

.ubicacion {
    text-align: center;
    font-size: 15px;
    font-weight: bold;
    text-transform: uppercase;
}

/* AVISO PEQUEÑO */

.aviso-celda {
    padding: 3px 1px !important;
    text-align: center;
}

.aviso {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 21px;
    height: 21px;
    min-width: 21px;
    min-height: 21px;
    padding: 2px;
    border: 1px solid #cbd5df;
    border-radius: 50%;
    background: white;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

.aviso-interior {
    display: block;
    width: 100%;
    height: 100%;
    border: 1.5px solid #bdc9d7;
    border-radius: 50%;
    background: white;
}

.aviso.activo {
    border-color: #e6a0a8;
    background: #fff1f2;
}

.aviso.activo .aviso-interior {
    background: var(--rojo);
    border-color: #b80e23;
}

/* ELIMINAR FILA */

.eliminar {
    display: block;
    width: auto;
    max-width: 85px;
    margin: 4px auto 0;
    padding: 4px 8px;
    min-height: 24px;
    border: 1px solid #efb8bf;
    border-radius: 5px;
    background: #fff0f1;
    color: #b51f2e;
    font-size: 10px;
    font-weight: bold;
    cursor: pointer;
}

/* LEYENDA */

.leyenda {
    margin-bottom: 13px;
    padding: 10px;
    background: #fff6f6;
    border: 1px solid #efc2c7;
    border-left: 5px solid var(--rojo);
    border-radius: 7px;
    font-size: 13px;
    line-height: 1.45;
}

.leyenda-titulo {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 5px;
    color: #ad1f2c;
    font-size: 14px;
    font-weight: 800;
}

.punto-rojo {
    display: inline-block;
    width: 17px;
    height: 17px;
    min-width: 17px;
    border: 1px solid #b60e20;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%,#ff6868,#d71930 65%,#a90016);
}

/* BOTONES */

.botones {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 13px;
}

.boton {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-width: 0;
    min-height: 52px;
    padding: 8px 5px;
    border: none;
    border-radius: 9px;
    font-size: 12px;
    font-weight: 800;
    line-height: 1.25;
    text-align: center;
    overflow-wrap: anywhere;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

.boton-primario {
    color: white;
    background: var(--azul);
}

.boton-secundario {
    color: #24496d;
    background: #e7eff9;
}

.boton-peligro {
    color: #b51f2e;
    background: #fff0f1;
}

.boton:active {
    transform: scale(.98);
}

.estado {
    margin-top: 8px;
    color: #526579;
    font-size: 12px;
    text-align: center;
}

/* MÓVILES ESTRECHOS */

@media(max-width:360px) {
    .contenido {
        padding: 9px;
    }

    .cabecera {
        padding: 13px 9px;
        gap: 8px;
    }

    .logo {
        width: 75px;
    }

    .titulos h1 {
        font-size: 17px;
    }

    .titulos p {
        font-size: 10px;
    }

    .firma {
        font-size: 10px;
    }

    .tabla th {
        font-size: 10px;
    }

    .entrada {
        font-size: 12px;
        padding: 3px;
    }

    .aviso {
        width: 19px;
        height: 19px;
        min-width: 19px;
        min-height: 19px;
    }

    .boton {
        font-size: 11px;
    }
}
</style>
</head>

<body>
<div class="app">

    <header class="cabecera">
        <img
            class="logo"
            src="IMG_5518.jpeg"
            alt="SONOCO"
        >

        <div class="separador"></div>

        <div class="titulos">
            <h1>CONTROL DE BARNICES</h1>
            <p>REGISTRO DE UBICACIONES</p>
            <div class="firma">By Rubén D. 268</div>
        </div>
    </header>

    <main class="contenido">

        <!-- FECHA Y HORA AUTOMÁTICAS: SIN CALENDARIO -->
        <section class="fecha-caja">
            <div class="fecha" id="fecha"></div>
            <div class="hora" id="hora"></div>
        </section>

        <!-- FOTOGRAFÍA SUPERIOR -->
        <img
            class="foto"
            src="IMG_5503.jpeg"
            alt="Ubicaciones de barnices"
        >

        <!-- TABLA -->
        <div class="tabla-contenedor">
            <table class="tabla">
                <colgroup>
                    <col class="col-descripcion">
                    <col class="col-aviso">
                    <col class="col-ubicacion">
                </colgroup>

                <thead>
                    <tr>
                        <th>DESCRIPCIÓN / BARNIZ</th>
                        <th>AVISO</th>
                        <th>UBICACIÓN</th>
                    </tr>
                </thead>

                <tbody id="filas"></tbody>
            </table>
        </div>

        <!-- EXPLICACIÓN -->
        <section class="leyenda">
            <div class="leyenda-titulo">
                <span class="punto-rojo"></span>
                <span>AVISO DE TRASVASE</span>
            </div>

            Marca con el símbolo rojo los barnices que requieren un
            trasvase de producto debido a su bajo nivel de contenido.
        </section>

        <!-- BOTONES -->
        <section class="botones">
            <button type="button"
                class="boton boton-primario"
                id="btnAnadir">+ AÑADIR FILA</button>

            <button type="button"
                class="boton boton-secundario"
                id="btnCompartir">COMPARTIR REGISTRO</button>

            <button type="button"
                class="boton boton-secundario"
                id="btnGuardar">GUARDAR IMAGEN</button>

            <button type="button"
                class="boton boton-peligro"
                id="btnLimpiar">LIMPIAR REGISTRO</button>
        </section>

        <!-- FOTOGRAFÍA INFERIOR -->
        <img
            class="foto foto-inferior"
            src="IMG_5504.jpeg"
            alt="Estanterías de barnices"
        >

        <div class="estado" id="estado"></div>
    </main>
</div>

<script>
"use strict";

/* UBICACIONES CONOCIDAS */
const UBICACIONES = {
    "814449": "W02008",
    "MKB113T": "W02009",
    "818083": "W02007",
    "110496": "W02010",
    "DISOLVENTE": "W02006",
    "MKW1301T": "W02005",
    "450148": "W02004",
    "816621": "W02003",
    "814509": "W02002"
};

const filas = document.getElementById("filas");
const estado = document.getElementById("estado");

function normalizar(texto) {
    return String(texto || "")
        .trim()
        .toUpperCase()
        .replace(/[.\s-]/g, "");
}

/* FECHA Y HORA ACTUALES */
function actualizarFechaHora() {
    const ahora = new Date();

    document.getElementById("fecha").textContent =
        new Intl.DateTimeFormat("es-ES", {
            day: "2-digit",
            month: "long",
            year: "numeric"
        }).format(ahora);

    document.getElementById("hora").textContent =
        "Hora: " +
        new Intl.DateTimeFormat("es-ES", {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false
        }).format(ahora);
}

actualizarFechaHora();
setInterval(actualizarFechaHora, 1000);

/* CREAR FILA */
function anadirFila() {
    const tr = document.createElement("tr");

    /* DESCRIPCIÓN */
    const tdDescripcion = document.createElement("td");

    const inputDescripcion = document.createElement("input");
    inputDescripcion.type = "text";
    inputDescripcion.className = "entrada descripcion";
    inputDescripcion.placeholder = "Barniz...";
    inputDescripcion.autocomplete = "off";
    inputDescripcion.setAttribute("aria-label", "Descripción del barniz");

    tdDescripcion.appendChild(inputDescripcion);

    /* ELIMINAR ESTA FILA */
    const botonEliminar = document.createElement("button");
    botonEliminar.type = "button";
    botonEliminar.className = "eliminar";
    botonEliminar.textContent = "ELIMINAR";

    botonEliminar.addEventListener("click", () => {
        tr.remove();
    });

    tdDescripcion.appendChild(botonEliminar);

    /* AVISO */
    const tdAviso = document.createElement("td");
    tdAviso.className = "aviso-celda";

    const botonAviso = document.createElement("button");
    botonAviso.type = "button";
    botonAviso.className = "aviso";
    botonAviso.setAttribute("aria-label", "Aviso de trasvase");
    botonAviso.setAttribute("aria-pressed", "false");

    const interior = document.createElement("span");
    interior.className = "aviso-interior";

    botonAviso.appendChild(interior);

    botonAviso.addEventListener("click", () => {
        const activo = botonAviso.classList.toggle("activo");

        botonAviso.setAttribute(
            "aria-pressed",
            activo ? "true" : "false"
        );
    });

    tdAviso.appendChild(botonAviso);

    /* UBICACIÓN */
    const tdUbicacion = document.createElement("td");

    const inputUbicacion = document.createElement("input");
    inputUbicacion.type = "text";
    inputUbicacion.className = "entrada ubicacion";
    inputUbicacion.autocomplete = "off";
    inputUbicacion.setAttribute("aria-label", "Ubicación");

    /*
      No se añade N.º ni ningún texto inventado.
      La ubicación se puede escribir manualmente.
    */
    inputUbicacion.addEventListener("input", () => {
        inputUbicacion.value = inputUbicacion.value
            .toUpperCase()
            .replace(/[^A-Z0-9]/g, "");
    });

    tdUbicacion.appendChild(inputUbicacion);

    tr.appendChild(tdDescripcion);
    tr.appendChild(tdAviso);
    tr.appendChild(tdUbicacion);

    filas.appendChild(tr);

    /* AUTOCOMPLETAR UBICACIONES CONOCIDAS */
    function actualizarUbicacion() {
        const clave = normalizar(inputDescripcion.value);

        if (!clave) {
            inputUbicacion.value = "";
            return;
        }

        if (Object.prototype.hasOwnProperty.call(UBICACIONES, clave)) {
            inputUbicacion.value = UBICACIONES[clave];
        }
    }

    inputDescripcion.addEventListener("input", actualizarUbicacion);
    inputDescripcion.addEventListener("change", actualizarUbicacion);

    return tr;
}

/* SOLO UNA FILA AL ABRIR */
anadirFila();

/* AÑADIR FILAS MANUALMENTE */
document.getElementById("btnAnadir").addEventListener("click", () => {
    const nueva = anadirFila();
    nueva.querySelector(".descripcion").focus();
});

/* LIMPIAR Y VOLVER A UNA SOLA FILA */
document.getElementById("btnLimpiar").addEventListener("click", () => {
    if (!confirm("¿Quieres limpiar el registro?")) {
        return;
    }

    filas.innerHTML = "";
    anadirFila();

    estado.textContent = "Registro limpio.";
});

/* CARGAR IMÁGENES */
function cargarImagen(ruta) {
    return new Promise((resolve) => {
        const img = new Image();

        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);

        img.src = ruta;
    });
}

/* LOGO SIN DEFORMAR */
function dibujarImagenContenida(ctx, img, x, y, w, h) {
    const escala = Math.min(w / img.width, h / img.height);
    const nw = img.width * escala;
    const nh = img.height * escala;

    ctx.drawImage(
        img,
        x + (w - nw) / 2,
        y + (h - nh) / 2,
        nw,
        nh
    );
}

/* FOTOGRAFÍAS PARA LA IMAGEN EXPORTADA */
function dibujarFoto(ctx, img, x, y, w, h) {
    ctx.save();

    ctx.beginPath();
    ctx.rect(x, y, w, h);
    ctx.clip();

    ctx.fillStyle = "#edf2f8";
    ctx.fillRect(x, y, w, h);

    if (img) {
        const escala = Math.max(w / img.width, h / img.height);
        const nw = img.width * escala;
        const nh = img.height * escala;

        ctx.drawImage(
            img,
            x + (w - nw) / 2,
            y + (h - nh) / 2,
            nw,
            nh
        );
    } else {
        ctx.fillStyle = "#243447";
        ctx.font = "16px Arial";
        ctx.fillText("Fotografía no disponible", x + 12, y + h / 2);
    }

    ctx.restore();

    ctx.strokeStyle = "#cbd8e6";
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, w, h);
}

/* CREAR IMAGEN COMPLETA PARA COMPARTIR O GUARDAR */
async function crearImagen() {
    const ancho = 900;
    const margen = 28;
    const interior = ancho - margen * 2;

    const datos = Array.from(filas.querySelectorAll("tr")).map((tr) => ({
        descripcion: tr.querySelector(".descripcion").value,
        ubicacion: tr.querySelector(".ubicacion").value,
        aviso: tr.querySelector(".aviso").classList.contains("activo")
    }));

    const logo = await cargarImagen("IMG_5518.jpeg");
    const foto1 = await cargarImagen("IMG_5503.jpeg");
    const foto2 = await cargarImagen("IMG_5504.jpeg");

    const altoCabecera = 160;
    const altoFecha = 68;
    const altoFoto = 95;
    const altoCabTabla = 52;
    const altoFila = 77;
    const altoLeyenda = 96;

    const alto =
        margen * 2 +
        altoCabecera +
        altoFecha +
        altoFoto * 2 +
        altoCabTabla +
        datos.length * altoFila +
        altoLeyenda +
        45;

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    canvas.width = ancho * 2;
    canvas.height = alto * 2;
    ctx.scale(2, 2);

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, ancho, alto);

    let y = margen;

    /* CABECERA */
    const gradiente = ctx.createLinearGradient(0, y, ancho, y + altoCabecera);
    gradiente.addColorStop(0, "#174a76");
    gradiente.addColorStop(1, "#216c9b");

    ctx.fillStyle = gradiente;
    ctx.fillRect(0, y, ancho, altoCabecera);

    if (logo) {
        dibujarImagenContenida(
            ctx, logo, margen + 10, y + 24, 125, 112
        );
    } else {
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 23px Arial";
        ctx.fillText("SONOCO", margen + 10, y + 80);
    }

    ctx.fillStyle = "rgba(255,255,255,.7)";
    ctx.fillRect(margen + 145, y + 20, 2, 120);

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 27px Arial";
    ctx.fillText("CONTROL DE BARNICES", margen + 170, y + 54);

    ctx.font = "19px Arial";
    ctx.fillText("REGISTRO DE UBICACIONES", margen + 170, y + 84);

    ctx.textAlign = "right";
    ctx.fillStyle = "#d0e1f1";
    ctx.font = "bold 15px Arial";
    ctx.fillText("By Rubén D. 268", ancho - margen - 10, y + 124);
    ctx.textAlign = "left";

    y += altoCabecera + 12;

    /* FECHA Y HORA */
    ctx.fillStyle = "#f5f8fc";
    ctx.fillRect(margen, y, interior, altoFecha);

    ctx.strokeStyle = "#cbd8e6";
    ctx.lineWidth = 2;
    ctx.strokeRect(margen, y, interior, altoFecha);

    ctx.textAlign = "center";
    ctx.fillStyle = "#194f7d";
    ctx.font = "bold 19px Arial";

    ctx.fillText(
        document.getElementById("fecha").textContent,
        ancho / 2,
        y + 27
    );

    ctx.fillStyle = "#526579";
    ctx.font = "15px Arial";

    ctx.fillText(
        document.getElementById("hora").textContent,
        ancho / 2,
        y + 49
    );

    ctx.textAlign = "left";
    y += altoFecha + 12;

    /* FOTO SUPERIOR */
    dibujarFoto(ctx, foto1, margen, y, interior, altoFoto);
    y += altoFoto + 12;

    /* TABLA */
    const x = margen;
    const anchoDesc = interior * .57;
    const anchoAviso = interior * .13;
    const anchoUbic = interior - anchoDesc - anchoAviso;

    const xAviso = x + anchoDesc;
    const xUbic = x + anchoDesc + anchoAviso;
    const inicioTabla = y;

    ctx.fillStyle = "#e7f0fa";
    ctx.fillRect(x, y, interior, altoCabTabla);

    ctx.fillStyle = "#24496d";
    ctx.font = "bold 14px Arial";
    ctx.textAlign = "center";

    ctx.fillText("DESCRIPCIÓN / BARNIZ", x + anchoDesc / 2, y + 32);
    ctx.fillText("AVISO", xAviso + anchoAviso / 2, y + 32);
    ctx.fillText("UBICACIÓN", xUbic + anchoUbic / 2, y + 32);

    ctx.textAlign = "left";

    y += altoCabTabla;

    datos.forEach((dato) => {
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(x, y, interior, altoFila);

        ctx.fillStyle = "#243447";
        ctx.font = "15px Arial";

        ctx.save();
        ctx.beginPath();
        ctx.rect(x + 8, y + 5, anchoDesc - 16, altoFila - 10);
        ctx.clip();
        ctx.fillText(dato.descripcion, x + 10, y + 30);
        ctx.restore();

        /* AVISO PEQUEÑO TAMBIÉN EN LA IMAGEN */
        const cx = xAviso + anchoAviso / 2;
        const cy = y + altoFila / 2;

        ctx.beginPath();
        ctx.arc(cx, cy, 11, 0, Math.PI * 2);
        ctx.fillStyle = "#ffffff";
        ctx.fill();
        ctx.strokeStyle = "#ccd5df";
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(cx, cy, 6, 0, Math.PI * 2);
        ctx.fillStyle = dato.aviso ? "#d71930" : "#ffffff";
        ctx.fill();
        ctx.strokeStyle = dato.aviso ? "#b80e23" : "#bdc9d7";
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.fillStyle = "#243447";
        ctx.font = "bold 16px Arial";
        ctx.textAlign = "center";

        ctx.fillText(
            dato.ubicacion,
            xUbic + anchoUbic / 2,
            y + altoFila / 2 + 5
        );

        ctx.textAlign = "left";

        y += altoFila;

        ctx.strokeStyle = "#cbd8e6";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + interior, y);
        ctx.stroke();
    });

    /* SEPARADORES AZULES */
    ctx.strokeStyle = "#194f7d";
    ctx.lineWidth = 3;

    ctx.beginPath();
    ctx.moveTo(x, inicioTabla);
    ctx.lineTo(x + interior, inicioTabla);

    ctx.moveTo(x, inicioTabla + altoCabTabla);
    ctx.lineTo(x + interior, inicioTabla + altoCabTabla);

    ctx.moveTo(xAviso, inicioTabla);
    ctx.lineTo(xAviso, y);

    ctx.moveTo(xUbic, inicioTabla);
    ctx.lineTo(xUbic, y);

    ctx.stroke();

    ctx.strokeRect(x, inicioTabla, interior, y - inicioTabla);

    y += 12;

    /* LEYENDA */
    ctx.fillStyle = "#fff6f6";
    ctx.fillRect(margen, y, interior, altoLeyenda);

    ctx.fillStyle = "#d71930";
    ctx.fillRect(margen, y, 5, altoLeyenda);

    ctx.strokeStyle = "#efc2c7";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(margen, y, interior, altoLeyenda);

    ctx.fillStyle = "#ad1f2c";
    ctx.font = "bold 18px Arial";
    ctx.fillText("AVISO DE TRASVASE", margen + 17, y + 28);

    ctx.fillStyle = "#243447";
    ctx.font = "14px Arial";
    ctx.fillText(
        "Marca con el símbolo rojo los barnices que requieren un",
        margen + 17,
        y + 53
    );
    ctx.fillText(
        "trasvase de producto debido a su bajo nivel de contenido.",
        margen + 17,
        y + 75
    );

    y += altoLeyenda + 12;

    /* FOTO INFERIOR */
    dibujarFoto(ctx, foto2, margen, y, interior, altoFoto);

    return canvas;
}

/* COMPARTIR IMAGEN */
async function compartirImagen() {
    const canvas = await crearImagen();

    const blob = await new Promise((resolve) => {
        canvas.toBlob(resolve, "image/png");
    });

    if (!blob) {
        throw new Error("No se pudo crear la imagen");
    }

    const archivo = new File(
        [blob],
        "CONTROL-DE-BARNICES.png",
        { type: "image/png" }
    );

    if (
        navigator.share &&
        navigator.canShare &&
        navigator.canShare({ files: [archivo] })
    ) {
        await navigator.share({
            files: [archivo],
            title: "Control de barnices",
            text: "Registro de ubicaciones de barnices."
        });
    } else {
        const url = URL.createObjectURL(blob);
        const enlace = document.createElement("a");

        enlace.href = url;
        enlace.download = "CONTROL-DE-BARNICES.png";
        enlace.click();

        setTimeout(() => URL.revokeObjectURL(url), 5000);
    }
}

/* GUARDAR IMAGEN */
document.getElementById("btnGuardar").addEventListener("click", async () => {
    estado.textContent = "Preparando imagen...";

    try {
        const canvas = await crearImagen();

        const blob = await new Promise((resolve) => {
            canvas.toBlob(resolve, "image/png");
        });

        if (!blob) {
            throw new Error("No se pudo crear la imagen");
        }

        const archivo = new File(
            [blob],
            "CONTROL-DE-BARNICES.png",
            { type: "image/png" }
        );

        if (
            navigator.share &&
            navigator.canShare &&
            navigator.canShare({ files: [archivo] })
        ) {
            await navigator.share({
                files: [archivo],
                title: "Control de barnices"
            });
            estado.textContent = "Imagen preparada.";
        } else {
            const url = URL.createObjectURL(blob);
            const enlace = document.createElement("a");

            enlace.href = url;
            enlace.download = "CONTROL-DE-BARNICES.png";
            enlace.click();

            setTimeout(() => URL.revokeObjectURL(url), 5000);
            estado.textContent = "Imagen preparada para guardar.";
        }
    } catch (error) {
        if (error.name === "AbortError") return;

        console.error(error);
        estado.textContent = "No se pudo guardar la imagen.";
        alert("No se pudo generar la imagen.");
    }
});

/* COMPARTIR REGISTRO */
document.getElementById("btnCompartir").addEventListener("click", async () => {
    estado.textContent = "Preparando registro...";

    try {
        await compartirImagen();
        estado.textContent = "Registro preparado para compartir.";
    } catch (error) {
        if (error.name === "AbortError") return;

        console.error(error);
        estado.textContent = "No se pudo compartir el registro.";
        alert("No se pudo compartir el registro. Prueba GUARDAR IMAGEN.");
    }
});
