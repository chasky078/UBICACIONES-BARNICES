<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#194f7d">
<title>CONTROL DE BARNICES - SONOCO</title>

<style>
:root {
    --azul: #194f7d;
    --azul2: #216c9b;
    --azul-claro: #e7f0fa;
    --borde: #cbd8e6;
    --rojo: #d71930;
    --texto: #243447;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 12px 7px 25px;
    background: #edf2f8;
    font-family: Arial, Helvetica, sans-serif;
    color: var(--texto);
}

.app {
    width: 100%;
    max-width: 760px;
    margin: auto;
    background: white;
    border-radius: 17px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(20, 55, 85, .10);
}

/* CABECERA SONOCO */

.cabecera {
    background: linear-gradient(120deg, #174a76, #216c9b);
    color: white;
    padding: 20px 16px;
    display: flex;
    align-items: center;
    gap: 13px;
}

.logo {
    width: 100px;
    max-width: 30%;
    height: auto;
    max-height: 105px;
    object-fit: contain;
    background: white;
    border-radius: 5px;
    padding: 4px;
}

.separador {
    width: 2px;
    min-width: 2px;
    align-self: stretch;
    background: rgba(255,255,255,.65);
}

.titulos {
    flex: 1;
    min-width: 0;
}

.titulos h1 {
    margin: 0 0 7px;
    font-size: clamp(19px, 4.5vw, 29px);
    line-height: 1.12;
}

.titulos p {
    margin: 0;
    font-size: clamp(12px, 3vw, 17px);
    line-height: 1.35;
}

.firma {
    margin-top: 12px;
    text-align: right;
    color: #d0e1f1;
    font-weight: bold;
    font-size: 13px;
}

/* CONTENIDO */

.contenido {
    padding: 15px;
}

.fecha-caja {
    margin-bottom: 18px;
    padding: 13px 8px;
    border: 2px solid var(--borde);
    border-radius: 10px;
    background: #f5f8fc;
    text-align: center;
}

.fecha {
    color: var(--azul);
    font-size: 19px;
    font-weight: bold;
}

.hora {
    margin-top: 5px;
    color: #526579;
    font-size: 15px;
}

/* FOTOGRAFÍAS */

.foto {
    display: block;
    width: 100%;
    height: 145px;
    object-fit: cover;
    border: 2px solid #d6e0eb;
    border-radius: 8px;
    margin: 0 0 18px;
}

.foto-inferior {
    margin: 20px 0 0;
}

/* TABLA */

.tabla-contenedor {
    width: 100%;
    border: 2px solid var(--azul);
    border-radius: 7px;
    overflow: hidden;
    margin-bottom: 18px;
}

.tabla {
    width: 100%;
    table-layout: fixed;
    border-collapse: collapse;
}

.col-descripcion {
    width: 57%;
}

.col-aviso {
    width: 14%;
}

.col-ubicacion {
    width: 29%;
}

.tabla th {
    padding: 12px 3px;
    background: var(--azul-claro);
    color: #24496d;
    font-size: 12px;
    font-weight: 800;
    line-height: 1.25;
    text-align: center;
    border-bottom: 3px solid var(--azul);
    border-right: 3px solid var(--azul);
    overflow-wrap: anywhere;
}

.tabla th:last-child {
    border-right: none;
}

.tabla td {
    padding: 7px 5px;
    height: 76px;
    vertical-align: middle;
    border-bottom: 2px solid var(--borde);
    border-right: 4px solid var(--azul);
    background: white;
}

.tabla td:last-child {
    border-right: none;
}

.tabla tr:last-child td {
    border-bottom: none;
}

.entrada {
    display: block;
    width: 100%;
    min-width: 0;
    height: 46px;
    padding: 6px;
    border: 2px solid #d6e0eb;
    border-radius: 7px;
    background: white;
    color: var(--texto);
    font-family: Arial, Helvetica, sans-serif;
    font-size: 15px;
    outline: none;
}

.entrada:focus {
    border-color: #3980b8;
}

.descripcion {
    text-transform: uppercase;
}

.ubicacion {
    text-align: center;
    font-weight: bold;
    font-size: 17px;
    text-transform: uppercase;
}

/* AVISO PEQUEÑO: NO DESCUADRA LA TABLA */

.aviso-celda {
    text-align: center;
    padding: 4px 1px !important;
}

.aviso {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    min-width: 30px;
    min-height: 30px;
    padding: 4px;
    border: 1.5px solid #ccd5df;
    border-radius: 50%;
    background: white;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

.aviso-interior {
    display: block;
    width: 100%;
    height: 100%;
    border: 2px solid #bdc9d7;
    border-radius: 50%;
    background: white;
}

.aviso.activo {
    border-color: #ed9ba5;
    background: #fff1f2;
}

.aviso.activo .aviso-interior {
    background: var(--rojo);
    border-color: #b80e23;
}

/* ELIMINAR FILA */

.eliminar {
    display: block;
    width: 100%;
    max-width: 100px;
    margin: 5px auto 0;
    padding: 5px 3px;
    min-height: 27px;
    border: 1px solid #efb8bf;
    border-radius: 6px;
    background: #fff0f1;
    color: #b51f2e;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
}

/* LEYENDA */

.leyenda {
    margin: 0 0 18px;
    padding: 12px;
    background: #fff6f6;
    border: 1.5px solid #efc2c7;
    border-left: 6px solid var(--rojo);
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.5;
}

.leyenda-titulo {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 7px;
    color: #ad1f2c;
    font-size: 15px;
    font-weight: 800;
}

.punto-rojo {
    display: inline-block;
    flex: 0 0 19px;
    width: 19px;
    height: 19px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ff6868, #d71930 65%, #a90016);
    border: 1px solid #b60e20;
}

/* BOTONES */

.botones {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
    margin-bottom: 18px;
}

.boton {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-width: 0;
    min-height: 58px;
    padding: 9px 6px;
    border: none;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 800;
    line-height: 1.25;
    text-align: center;
    overflow-wrap: anywhere;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

.boton-primario {
    color: white;
    background: var(--azul);
}

.boton-secundario {
    color: #24496d;
    background: #e7eff9;
}

.boton-peligro {
    color: #b51f2e;
    background: #fff0f1;
}

.boton:active {
    transform: scale(.98);
}

.estado {
    margin-top: 10px;
    text-align: center;
    color: #526579;
    font-size: 12px;
}

/* PANTALLAS PEQUEÑAS */

@media (max-width: 380px) {
    .contenido {
        padding: 10px;
    }

    .cabecera {
        padding: 16px 10px;
        gap: 9px;
    }

    .logo {
        width: 83px;
    }

    .titulos h1 {
        font-size: 19px;
    }

    .titulos p {
        font-size: 11px;
    }

    .firma {
        font-size: 11px;
    }

    .tabla th {
        font-size: 11px;
        padding: 10px 2px;
    }

    .tabla td {
        padding: 5px 3px;
    }

    .entrada {
        padding: 4px;
        font-size: 13px;
    }

    .aviso {
        width: 27px;
        height: 27px;
        min-width: 27px;
        min-height: 27px;
        padding: 3px;
    }

    .boton {
        font-size: 12px;
        min-height: 55px;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="cabecera">
        <img
            class="logo"
            src="IMG_5518.jpeg"
            alt="SONOCO"
        >

        <div class="separador"></div>

        <div class="titulos">
            <h1>CONTROL DE BARNICES</h1>
            <p>REGISTRO DE UBICACIONES</p>
            <div class="firma">By Rubén D. 268</div>
        </div>
    </header>

    <main class="contenido">

        <!-- FECHA Y HORA AUTOMÁTICAS, SIN CALENDARIO -->
        <section class="fecha-caja">
            <div class="fecha" id="fecha"></div>
            <div class="hora" id="hora"></div>
        </section>

        <!-- FOTOGRAFÍA SUPERIOR -->
        <img
            class="foto"
            src="IMG_5503.jpeg"
            alt="Ubicaciones de barnices"
        >

        <!-- TABLA DE REGISTRO -->
        <div class="tabla-contenedor">
            <table class="tabla">

                <colgroup>
                    <col class="col-descripcion">
                    <col class="col-aviso">
                    <col class="col-ubicacion">
                </colgroup>

                <thead>
                    <tr>
                        <th>DESCRIPCIÓN / BARNIZ</th>
                        <th>AVISO</th>
                        <th>UBICACIÓN</th>
                    </tr>
                </thead>

                <tbody id="filas"></tbody>

            </table>
        </div>

        <!-- EXPLICACIÓN DEL AVISO -->
        <section class="leyenda">
            <div class="leyenda-titulo">
                <span class="punto-rojo"></span>
                <span>AVISO DE TRASVASE</span>
            </div>

            Marca con el símbolo rojo los barnices que requieren
            un trasvase de producto debido a su bajo nivel de contenido.
        </section>

        <!-- BOTONES -->
        <section class="botones">

            <button
                type="button"
                class="boton boton-primario"
                id="btnAnadir"
            >+ AÑADIR FILA</button>

            <button
                type="button"
                class="boton boton-secundario"
                id="btnCompartir"
            >COMPARTIR REGISTRO</button>

            <button
                type="button"
                class="boton boton-secundario"
                id="btnGuardar"
            >GUARDAR IMAGEN</button>

            <button
                type="button"
                class="boton boton-peligro"
                id="btnLimpiar"
            >LIMPIAR REGISTRO</button>

        </section>

        <!-- FOTOGRAFÍA INFERIOR -->
        <img
            class="foto foto-inferior"
            src="IMG_5504.jpeg"
            alt="Estanterías de barnices"
        >

        <div class="estado" id="estado"></div>

    </main>
</div>

<script>
"use strict";

/* UBICACIONES AUTOMÁTICAS DE LOS BARNICES */
const UBICACIONES = {
    "814449": "W02008",
    "MKB113T": "W02009",
    "818083": "W02007",
    "110496": "W02010",
    "DISOLVENTE": "W02006",
    "MKW1301T": "W02005",
    "450148": "W02004",
    "816621": "W02003",
    "814509": "W02002"
};

const filas = document.getElementById("filas");
const estado = document.getElementById("estado");

/* NORMALIZAR CÓDIGOS */
function normalizar(texto) {
    return String(texto || "")
        .trim()
        .toUpperCase()
        .replace(/[.\s-]/g, "");
}

/* FECHA Y HORA ACTUALES */
function actualizarFechaHora() {
    const ahora = new Date();

    document.getElementById("fecha").textContent =
        new Intl.DateTimeFormat("es-ES", {
            day: "2-digit",
            month: "long",
            year: "numeric"
        }).format(ahora);

    document.getElementById("hora").textContent =
        "Hora: " +
        new Intl.DateTimeFormat("es-ES", {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false
        }).format(ahora);
}

actualizarFechaHora();
setInterval(actualizarFechaHora, 1000);

/* CREAR FILA */
function anadirFila(descripcionInicial = "", ubicacionInicial = "", avisoInicial = false) {

    const tr = document.createElement("tr");

    /* DESCRIPCIÓN */
    const tdDescripcion = document.createElement("td");

    const inputDescripcion = document.createElement("input");
    inputDescripcion.type = "text";
    inputDescripcion.className = "entrada descripcion";
    inputDescripcion.placeholder = "Barniz...";
    inputDescripcion.autocomplete = "off";
    inputDescripcion.setAttribute("aria-label", "Descripción del barniz");
    inputDescripcion.value = descripcionInicial;

    tdDescripcion.appendChild(inputDescripcion);

    /* BOTÓN ELIMINAR FILA */
    const botonEliminar = document.createElement("button");
    botonEliminar.type = "button";
    botonEliminar.className = "eliminar";
    botonEliminar.textContent = "ELIMINAR";
    botonEliminar.setAttribute("aria-label", "Eliminar esta fila");

    botonEliminar.addEventListener("click", () => {
        tr.remove();
    });

    tdDescripcion.appendChild(botonEliminar);

    /* AVISO */
    const tdAviso = document.createElement("td");
    tdAviso.className = "aviso-celda";

    const botonAviso = document.createElement("button");
    botonAviso.type = "button";
    botonAviso.className = "aviso";
    botonAviso.setAttribute("aria-label", "Aviso de trasvase");
    botonAviso.setAttribute(
        "aria-pressed",
        avisoInicial ? "true" : "false"
    );

    const interior = document.createElement("span");
    interior.className = "aviso-interior";

    botonAviso.appendChild(interior);

    if (avisoInicial) {
        botonAviso.classList.add("activo");
    }

    botonAviso.addEventListener("click", () => {
        const activo = botonAviso.classList.toggle("activo");

        botonAviso.setAttribute(
            "aria-pressed",
            activo ? "true" : "false"
        );
    });

    tdAviso.appendChild(botonAviso);

    /* UBICACIÓN */
    const tdUbicacion = document.createElement("td");

    const inputUbicacion = document.createElement("input");
    inputUbicacion.type = "text";
    inputUbicacion.className = "entrada ubicacion";
    inputUbicacion.autocomplete = "off";
    inputUbicacion.setAttribute("aria-label", "Ubicación");
    inputUbicacion.value = ubicacionInicial;

    /*
      La ubicación se puede escribir manualmente.
      No se añade N.º ni otro texto automáticamente.
    */
    inputUbicacion.addEventListener("input", () => {
        inputUbicacion.value = inputUbicacion.value
            .toUpperCase()
            .replace(/[^A-Z0-9]/g, "");
    });

    tdUbicacion.appendChild(inputUbicacion);

    tr.appendChild(tdDescripcion);
    tr.appendChild(tdAviso);
    tr.appendChild(tdUbicacion);

    filas.appendChild(tr);

    /* AUTOCOMPLETAR SOLO LOS BARNICES CONOCIDOS */
    function actualizarUbicacion() {
        const clave = normalizar(inputDescripcion.value);

        if (!clave) {
            inputUbicacion.value = "";
            return;
        }

        if (Object.prototype.hasOwnProperty.call(UBICACIONES, clave)) {
            inputUbicacion.value = UBICACIONES[clave];
        }
    }

    inputDescripcion.addEventListener("input", actualizarUbicacion);
    inputDescripcion.addEventListener("change", actualizarUbicacion);

    if (descripcionInicial) {
        actualizarUbicacion();

        if (
            !Object.prototype.hasOwnProperty.call(
                UBICACIONES,
                normalizar(descripcionInicial)
            )
        ) {
            inputUbicacion.value = ubicacionInicial;
        }
    }

    return tr;
}

/* CUATRO FILAS INICIALES */
for (let i = 0; i < 4; i++) {
    anadirFila();
}

/* AÑADIR FILA */
document.getElementById("btnAnadir").addEventListener("click", () => {
    const nueva = anadirFila();
    nueva.querySelector(".descripcion").focus();
});

/* LIMPIAR REGISTRO */
document.getElementById("btnLimpiar").addEventListener("click", () => {

    if (!confirm("¿Quieres limpiar todas las filas del registro?")) {
        return;
    }

    filas.innerHTML = "";

    for (let i = 0; i < 4; i++) {
        anadirFila();
    }

    estado.textContent = "Registro limpio.";
});

/* CARGAR FOTOGRAFÍAS PARA LA IMAGEN */
function cargarImagen(ruta) {
    return new Promise((resolve) => {
        const img = new Image();

        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);

        img.src = ruta;
    });
}

/* LOGO AJUSTADO SIN DEFORMAR */
function dibujarImagenContenida(ctx, img, x, y, w, h) {
    const escala = Math.min(w / img.width, h / img.height);
    const nw = img.width * escala;
    const nh = img.height * escala;

    ctx.drawImage(
        img,
        x + (w - nw) / 2,
        y + (h - nh) / 2,
        nw,
        nh
    );
}

/* FOTOGRAFÍAS EN LA IMAGEN EXPORTADA */
function dibujarFoto(ctx, img, x, y, w, h) {
    ctx.save();

    ctx.beginPath();
    ctx.rect(x, y, w, h);
    ctx.clip();

    ctx.fillStyle = "#edf2f8";
    ctx.fillRect(x, y, w, h);

    if (img) {
        const escala = Math.max(w / img.width, h / img.height);
        const nw = img.width * escala;
        const nh = img.height * escala;

        ctx.drawImage(
            img,
            x + (w - nw) / 2,
            y + (h - nh) / 2,
            nw,
            nh
        );
    } else {
        ctx.fillStyle = "#243447";
        ctx.font = "20px Arial";
        ctx.fillText("Fotografía no disponible", x + 15, y + h / 2);
    }

    ctx.restore();

    ctx.strokeStyle = "#cbd8e6";
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, w, h);
}

/* TEXTO AJUSTADO A LA CELDA */
function escribirTextoAjustado(ctx, texto, x, y, anchoMax) {
    let linea = "";
    const palabras = String(texto || "").split(/\s+/);

    for (const palabra of palabras) {
        const prueba = linea ? linea + " " + palabra : palabra;

        if (ctx.measureText(prueba).width > anchoMax && linea) {
            ctx.fillText(linea, x, y);
            y += 25;
            linea = palabra;
        } else {
            linea = prueba;
        }
    }

    if (linea) {
        ctx.fillText(linea, x, y);
    }
}

/* CREAR IMAGEN COMPLETA DEL REGISTRO */
async function crearImagen() {

    const ancho = 1000;
    const margen = 35;
    const interior = ancho - margen * 2;

    const datos = Array.from(filas.querySelectorAll("tr")).map((tr) => ({
        descripcion: tr.querySelector(".descripcion").value,
        ubicacion: tr.querySelector(".ubicacion").value,
        aviso: tr.querySelector(".aviso").classList.contains("activo")
    }));

    const logo = await cargarImagen("IMG_5518.jpeg");
    const foto1 = await cargarImagen("IMG_5503.jpeg");
    const foto2 = await cargarImagen("IMG_5504.jpeg");

    const altoCabecera = 190;
    const altoFecha = 80;
    const altoFoto = 180;
    const altoCabTabla = 60;
    const altoFila = 92;
    const altoLeyenda = 110;

    const alto =
        margen * 2 +
        altoCabecera +
        altoFecha +
        altoFoto * 2 +
        altoCabTabla +
        datos.length * altoFila +
        altoLeyenda +
        70;

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    canvas.width = ancho * 2;
    canvas.height = alto * 2;

    ctx.scale(2, 2);

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, ancho, alto);

    let y = margen;

    /* CABECERA */
    const gradiente = ctx.createLinearGradient(0, y, ancho, y + altoCabecera);
    gradiente.addColorStop(0, "#174a76");
    gradiente.addColorStop(1, "#216c9b");

    ctx.fillStyle = gradiente;
    ctx.fillRect(0, y, ancho, altoCabecera);

    if (logo) {
        dibujarImagenContenida(ctx, logo, margen + 10, y + 30, 150, 130);
    } else {
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 28px Arial";
        ctx.fillText("SONOCO", margen + 10, y + 95);
    }

    ctx.fillStyle = "rgba(255,255,255,.7)";
    ctx.fillRect(margen + 175, y + 25, 3, 140);

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 31px Arial";
    ctx.fillText("CONTROL DE BARNICES", margen + 205, y + 65);

    ctx.font = "22px Arial";
    ctx.fillText("REGISTRO DE UBICACIONES", margen + 205, y + 100);

    ctx.textAlign = "right";
    ctx.fillStyle = "#d0e1f1";
    ctx.font = "bold 17px Arial";
    ctx.fillText("By Rubén D. 268", ancho - margen - 10, y + 145);
    ctx.textAlign = "left";

    y += altoCabecera + 15;

    /* FECHA Y HORA */
    ctx.fillStyle = "#f5f8fc";
    ctx.fillRect(margen, y, interior, altoFecha);

    ctx.strokeStyle = "#cbd8e6";
    ctx.lineWidth = 2;
    ctx.strokeRect(margen, y, interior, altoFecha);

    ctx.textAlign = "center";
    ctx.fillStyle = "#194f7d";
    ctx.font = "bold 22px Arial";

    ctx.fillText(
        document.getElementById("fecha").textContent,
        ancho / 2,
        y + 30
    );

    ctx.fillStyle = "#526579";
    ctx.font = "17px Arial";

    ctx.fillText(
        document.getElementById("hora").textContent,
        ancho / 2,
        y + 57
    );

    ctx.textAlign = "left";
    y += altoFecha + 15;

    /* FOTO SUPERIOR */
    dibujarFoto(ctx, foto1, margen, y, interior, altoFoto);
    y += altoFoto + 15;

    /* TABLA DE TRES COLUMNAS */
    const x = margen;
    const anchoDesc = interior * 0.57;
    const anchoAviso = interior * 0.14;
    const anchoUbic = interior - anchoDesc - anchoAviso;

    const xAviso = x + anchoDesc;
    const xUbic = x + anchoDesc + anchoAviso;

    ctx.fillStyle = "#e7f0fa";
    ctx.fillRect(x, y, interior, altoCabTabla);

    ctx.strokeStyle = "#194f7d";
    ctx.lineWidth = 3;
    ctx.strokeRect(x, y, interior, altoCabTabla);

    ctx.fillStyle = "#24496d";
    ctx.font = "bold 16px Arial";
    ctx.textAlign = "center";

    ctx.fillText("DESCRIPCIÓN / BARNIZ", x + anchoDesc / 2, y + 36);
    ctx.fillText("AVISO", xAviso + anchoAviso / 2, y + 36);
    ctx.fillText("UBICACIÓN", xUbic + anchoUbic / 2, y + 36);

    ctx.textAlign = "left";

    const inicioTabla = y;
    y += altoCabTabla;

    datos.forEach((dato) => {

        ctx.fillStyle = "#ffffff";
        ctx.fillRect(x, y, interior, altoFila);

        ctx.strokeStyle = "#cbd8e6";
        ctx.lineWidth = 1.5;

        ctx.beginPath();
        ctx.moveTo(x, y + altoFila);
        ctx.lineTo(x + interior, y + altoFila);
        ctx.stroke();

        ctx.fillStyle = "#243447";
        ctx.font = "17px Arial";

        escribirTextoAjustado(
            ctx,
            dato.descripcion,
            x + 12,
            y + 40,
            anchoDesc - 24
        );

        /* CÍRCULO PEQUEÑO EN LA IMAGEN */
        const cx = xAviso + anchoAviso / 2;
        const cy = y + altoFila / 2;

        ctx.beginPath();
        ctx.arc(cx, cy, 15, 0, Math.PI * 2);
        ctx.fillStyle = "#ffffff";
        ctx.fill();
        ctx.strokeStyle = dato.aviso ? "#ed9ba5" : "#ccd5df";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(cx, cy, 9, 0, Math.PI * 2);
        ctx.fillStyle = dato.aviso ? "#d71930" : "#ffffff";
        ctx.fill();
        ctx.strokeStyle = dato.aviso ? "#b80e23" : "#bdc9d7";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = "#243447";
        ctx.font = "bold 18px Arial";
        ctx.textAlign = "center";

        ctx.fillText(
            dato.ubicacion,
            xUbic + anchoUbic / 2,
            y + altoFila / 2 + 6
        );

        ctx.textAlign = "left";
        y += altoFila;
    });

    /* SEPARADORES AZULES */
    ctx.strokeStyle = "#194f7d";
    ctx.lineWidth = 4;

    ctx.beginPath();
    ctx.moveTo(xAviso, inicioTabla);
    ctx.lineTo(xAviso, y);

    ctx.moveTo(xUbic, inicioTabla);
    ctx.lineTo(xUbic, y);

    ctx.stroke();

    ctx.strokeStyle = "#194f7d";
    ctx.lineWidth = 3;
    ctx.strokeRect(x, inicioTabla, interior, y - inicioTabla);

    y += 18;

    /* LEYENDA */
    ctx.fillStyle = "#fff6f6";
    ctx.fillRect(margen, y, interior, altoLeyenda);

    ctx.strokeStyle = "#efc2c7";
    ctx.lineWidth = 2;
    ctx.strokeRect(margen, y, interior, altoLeyenda);

    ctx.fillStyle = "#d71930";
    ctx.fillRect(margen, y, 6, altoLeyenda);

    ctx.fillStyle = "#ad1f2c";
    ctx.font = "bold 20px Arial";
    ctx.fillText("AVISO DE TRASVASE", margen + 22, y + 31);

    ctx.fillStyle = "#243447";
    ctx.font = "16px Arial";

    ctx.fillText(
        "Marca con el símbolo rojo los barnices que requieren un",
        margen + 22,
        y + 60
    );

    ctx.fillText(
        "trasvase de producto debido a su bajo nivel de contenido.",
        margen + 22,
        y + 84
    );

    y += altoLeyenda + 18;

    /* FOTO INFERIOR */
    dibujarFoto(ctx, foto2, margen, y, interior, altoFoto);

    return canvas;
}

/* GUARDAR IMAGEN */
document.getElementById("btnGuardar").addEventListener("click", async () => {

    estado.textContent = "Preparando imagen...";

    try {
        const canvas = await crearImagen();

        const blob = await new Promise((resolve) => {
            canvas.toBlob(resolve, "image/png");
        });

        if (!blob) {
            throw new Error("No se pudo crear la imagen");
        }

        const archivo = new File(
            [blob],
            "CONTROL-DE-BARNICES.png",
            { type: "image/png" }
        );

        if (
            navigator.share &&
            navigator.canShare &&
            navigator.canShare({ files: [archivo] })
        ) {
            await navigator.share({
                files: [archivo],
                title: "Control de barnices"
            });

            estado.textContent = "Menú para guardar o compartir abierto.";
        } else {
            const url = URL.createObjectURL(blob);
            const enlace = document.createElement("a");

            enlace.href = url;
            enlace.download = "CONTROL-DE-BARNICES.png";
            enlace.click();

            setTimeout(() => URL.revokeObjectURL(url), 5000);

            estado.textContent = "Imagen preparada para guardar.";
        }

    } catch (error) {
        if (error.name === "AbortError") return;

        console.error(error);
        estado.textContent = "No se pudo generar la imagen.";
        alert("No se pudo guardar la imagen. Comprueba las fotografías.");
    }
});

/* COMPARTIR REGISTRO */
document.getElementById("btnCompartir").addEventListener("click", async () => {

    estado.textContent = "Preparando registro para compartir...";

    try {
        const canvas = await crearImagen();

        const blob = await new Promise((resolve) => {
            canvas.toBlob(resolve, "image/png");
        });

        if (!blob) {
            throw new Error("No se pudo crear la imagen");
        }

        const archivo = new File(
            [blob],
            "CONTROL-DE-BARNICES.png",
            { type: "image/png" }
        );

        if (
            navigator.share &&
            navigator.canShare &&
            navigator.canShare({ files: [archivo] })
        ) {
            await navigator.share({
                files: [archivo],
                title: "Control de barnices",
                text: "Registro de ubicaciones de barnices."
            });

            estado.textContent = "Registro listo para compartir.";

        } else {
            const url = URL.createObjectURL(blob);
            const enlace = document.createElement("a");

            enlace.href = url;
            enlace.download = "CONTROL-DE-BARNICES.png";
            enlace.click();

            setTimeout(() => URL.revokeObjectURL(url), 5000);

            estado.textContent =
                "Imagen descargada. Puedes compartirla desde el dispositivo.";
        }

    } catch (error) {
        if (error.name === "AbortError") return;

        console.error(error);
        estado.textContent = "No se pudo compartir el registro.";
        alert("No se pudo compartir. Prueba con GUARDAR IMAGEN.");
    }
});
