<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#104d83">
<title>CONTROL DE BARNICES</title>

<style>
:root {
    --azul: #104d83;
    --azul-oscuro: #123d67;
    --azul-claro: #e5f0ff;
    --borde: #dce5ef;
    --fondo: #f5f8fc;
    --texto: #203b56;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--fondo);
    color: var(--texto);
    font-family: Arial, Helvetica, sans-serif;
}

.contenedor {
    max-width: 1200px;
    margin: 0 auto;
    background: white;
    min-height: 100vh;
}

/* CABECERA */

.cabecera {
    background: linear-gradient(110deg, #104477, #12609c);
    color: white;
    padding: 20px 24px;
    display: flex;
    align-items: center;
    gap: 20px;
    min-height: 150px;
}

.logo {
    min-width: 122px;
    min-height: 95px;
    padding-right: 18px;
    border-right: 1px solid rgba(255,255,255,.55);
    display: flex;
    align-items: center;
    justify-content: center;
}

.logo img {
    width: 105px;
    max-height: 75px;
    object-fit: contain;
}

.logo-texto {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: .5px;
}

.titulos h1 {
    margin: 0 0 5px;
    font-size: clamp(23px, 4vw, 36px);
    line-height: 1.1;
}

.subtitulo {
    font-size: clamp(15px, 2.6vw, 24px);
    margin-bottom: 8px;
    color: #e6eff9;
}

.firma {
    font-size: 15px;
    color: #bcd8f5;
}

/* FOTOGRAFÍAS: SIN TÍTULOS NI DESCRIPCIONES */

.foto-contenedor {
    padding: 0 28px;
    background: white;
}

.foto {
    display: block;
    width: 100%;
    height: 105px;
    object-fit: cover;
    object-position: center;
}

/* CONTENIDO */

.contenido {
    padding: 15px 28px 25px;
}

.fecha {
    color: #526b83;
    font-size: 15px;
    margin: 0 0 10px;
}

h2 {
    color: var(--azul-oscuro);
    font-size: 24px;
    margin: 0 0 20px;
}

/* TABLA */

.tabla {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    border: 1px solid var(--borde);
}

.tabla th {
    background: var(--azul-claro);
    color: #234a72;
    padding: 13px 11px;
    text-align: left;
    font-size: 15px;
}

.tabla th:first-child {
    width: 63%;
}

.tabla th:last-child {
    width: 37%;
}

.tabla td {
    border-top: 1px solid var(--borde);
    padding: 5px 10px;
    height: 49px;
}

.tabla tbody tr:nth-child(even) {
    background: #f7f9fd;
}

.campo-barniz {
    width: 100%;
    border: none;
    background: transparent;
    outline: none;
    padding: 9px 1px;
    font-size: 16px;
    color: var(--texto);
    font-family: inherit;
    min-width: 0;
}

.campo-barniz:focus {
    box-shadow: inset 0 -2px 0 #2583ce;
}

.campo-ubicacion {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 16px;
    font-weight: bold;
    color: var(--azul-oscuro);
}

.prefijo {
    min-width: 15px;
    font-weight: 800;
}

.numero-ubicacion {
    width: 100%;
    min-width: 0;
    border: none;
    outline: none;
    background: transparent;
    color: var(--azul-oscuro);
    font-size: 16px;
    font-weight: 800;
    font-family: inherit;
    padding: 9px 0;
}

.numero-ubicacion:focus {
    box-shadow: inset 0 -2px 0 #2583ce;
}

/* BOTONES */

.botones {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 18px 0 22px;
}

.boton {
    border: none;
    border-radius: 7px;
    padding: 13px 17px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
}

.boton-azul {
    background: var(--azul);
    color: white;
}

.boton-claro {
    background: #e8eff8;
    color: var(--azul-oscuro);
}

.boton-rojo {
    background: #fff0f0;
    color: #a72c2c;
}

.boton:active {
    transform: scale(.98);
}

/* PIE */

.pie {
    text-align: center;
    padding: 16px;
    color: #71849a;
    font-size: 12px;
    border-top: 1px solid #e5ebf2;
}

/* VISTA EN MÓVIL */

@media (max-width: 600px) {
    .cabecera {
        padding: 16px 13px;
        gap: 12px;
        min-height: 125px;
    }

    .logo {
        min-width: 91px;
        padding-right: 10px;
        min-height: 80px;
    }

    .logo img {
        width: 78px;
    }

    .logo-texto {
        font-size: 17px;
    }

    .titulos h1 {
        font-size: 23px;
    }

    .subtitulo {
        font-size: 15px;
    }

    .firma {
        font-size: 13px;
    }

    .foto-contenedor {
        padding: 0 12px;
    }

    .foto {
        height: 85px;
    }

    .contenido {
        padding: 13px 12px 20px;
    }

    h2 {
        font-size: 21px;
    }

    .tabla th {
        font-size: 13px;
        padding: 11px 7px;
    }

    .tabla th:first-child {
        width: 61%;
    }

    .tabla th:last-child {
        width: 39%;
    }

    .tabla td {
        padding: 4px 7px;
        height: 47px;
    }

    .campo-barniz,
    .numero-ubicacion,
    .campo-ubicacion {
        font-size: 15px;
    }

    .boton {
        padding: 12px;
        font-size: 13px;
    }
}

/* IMPRESIÓN */

@media print {
    body {
        background: white;
    }

    .botones {
        display: none;
    }

    .contenedor {
        max-width: none;
    }

    .campo-barniz,
    .numero-ubicacion {
        box-shadow: none !important;
    }
}
</style>
</head>

<body>

<div class="contenedor">

    <header class="cabecera">

        <div class="logo">
            <img
                id="logoSonoco"
                src="https://upload.wikimedia.org/wikipedia/commons/8/8d/Sonoco.svg"
                alt="SONOCO"
                onerror="this.style.display='none';document.getElementById('logoTexto').style.display='block';"
            >

            <span id="logoTexto" class="logo-texto" style="display:none;">
                SONOCO
            </span>
        </div>

        <div class="titulos">
            <h1>CONTROL DE BARNICES</h1>
            <div class="subtitulo">REGISTRO DE UBICACIONES</div>
            <div class="firma">By Rubén D. 268</div>
        </div>

    </header>

    <!-- PRIMERA FOTO: SOLO IMAGEN -->

    <div class="foto-contenedor">
        <img
            class="foto"
            src="IMG_5503.jpeg"
            alt=""
        >
    </div>

    <main class="contenido">

        <p class="fecha">
            FECHA DEL REGISTRO:
            <span id="fechaRegistro"></span>
        </p>

        <h2>REGISTRO DE BARNICES</h2>

        <table class="tabla">

            <thead>
                <tr>
                    <th>DESCRIPCIÓN / BARNIZ</th>
                    <th>UBICACIÓN</th>
                </tr>
            </thead>

            <tbody id="filas"></tbody>

        </table>

        <div class="botones">

            <button
                class="boton boton-azul"
                type="button"
                onclick="anadirFila(true)"
            >
                + AÑADIR FILA
            </button>

            <button
                class="boton boton-claro"
                type="button"
                onclick="compartirRegistro()"
            >
                COMPARTIR REGISTRO
            </button>

            <button
                class="boton boton-claro"
                type="button"
                onclick="descargarRegistro()"
            >
                GUARDAR IMAGEN
            </button>

            <button
                class="boton boton-rojo"
                type="button"
                onclick="limpiarRegistro()"
            >
                LIMPIAR REGISTRO
            </button>

        </div>

    </main>

    <!-- SEGUNDA FOTO: SOLO IMAGEN -->

    <div class="foto-contenedor">
        <img
            class="foto"
            src="IMG_5504.jpeg"
            alt=""
        >
    </div>

    <footer class="pie">
        CONTROL DE BARNICES · SONOCO
    </footer>

</div>

<script>

/* UBICACIONES CONOCIDAS */

const ubicaciones = {
    "814.449": "W02008",
    "MKB113T": "W02009",
    "818.083": "W02007",
    "110.496": "W02010",
    "DISOLVENTE": "W02006",
    "MKW1301T": "W02005",
    "450.148": "W02004",
    "816.621": "W02003",
    "814.509": "W02002"
};

/* NORMALIZAR CÓDIGOS:
   RECONOCE EL CÓDIGO CON O SIN PUNTOS,
   ESPACIOS O GUIONES. */

function normalizar(texto) {
    return String(texto || "")
        .trim()
        .toUpperCase()
        .replace(/[.\s-]/g, "");
}

/* BUSCAR UBICACIÓN */

function buscarUbicacion(descripcion) {
    const codigo = normalizar(descripcion);

    for (const clave in ubicaciones) {
        if (normalizar(clave) === codigo) {
            return ubicaciones[clave];
        }
    }

    return null;
}

/* FECHA Y HORA */

function actualizarFecha() {
    const ahora = new Date();

    const fecha = ahora.toLocaleDateString("es-ES", {
        day: "2-digit",
        month: "2-digit",
        year: "2-digit"
    });

    const hora = ahora.toLocaleTimeString("es-ES", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
    });

    document.getElementById("fechaRegistro").textContent =
        fecha + ", " + hora;
}

actualizarFecha();

/* CREAR FILA */

function anadirFila(enfocar = false) {

    const tbody = document.getElementById("filas");
    const fila = document.createElement("tr");

    fila.innerHTML = `
        <td>
            <input
                class="campo-barniz"
                type="text"
                placeholder=""
                autocomplete="off"
                aria-label="Descripción o código del barniz"
            >
        </td>

        <td>
            <div class="campo-ubicacion">
                <span class="prefijo">A</span>

                <input
                    class="numero-ubicacion"
                    type="text"
                    inputmode="numeric"
                    pattern="[0-9]*"
                    placeholder=""
                    autocomplete="off"
                    aria-label="Número de ubicación"
                >
            </div>
        </td>
    `;

    tbody.appendChild(fila);

    const descripcion = fila.querySelector(".campo-barniz");
    const prefijo = fila.querySelector(".prefijo");
    const numero = fila.querySelector(".numero-ubicacion");

    /* AL ESCRIBIR EL BARNIZ */

    descripcion.addEventListener("input", function() {

        const ubicacion = buscarUbicacion(this.value);

        if (ubicacion) {

            prefijo.textContent = ubicacion.charAt(0);
            numero.value = ubicacion.substring(1);

        } else if (this.value.trim() !== "") {

            /* BARNIZ NO REGISTRADO: UBICACIÓN TIPO A */

            prefijo.textContent = "A";

        } else {

            prefijo.textContent = "A";
            numero.value = "";

        }

    });

    /* SOLO DÍGITOS EN EL NÚMERO DE UBICACIÓN */

    numero.addEventListener("input", function() {
        this.value = this.value.replace(/\D/g, "");
    });

    /* AL AÑADIR FILA, PREPARAR LA NUEVA DESCRIPCIÓN */

    if (enfocar) {
        setTimeout(function() {
            descripcion.focus();
        }, 100);
    }

    return fila;
}

/* CUATRO FILAS INICIALES */

for (let i = 0; i < 4; i++) {
    anadirFila(false);
}

/* OBTENER LOS DATOS */

function obtenerDatos() {

    const filas = document.querySelectorAll("#filas tr");
    const datos = [];

    filas.forEach(function(fila) {

        const descripcion =
            fila.querySelector(".campo-barniz").value.trim();

        const prefijo =
            fila.querySelector(".prefijo").textContent;

        const numero =
            fila.querySelector(".numero-ubicacion").value.trim();

        if (descripcion !== "" || numero !== "") {
            datos.push({
                descripcion: descripcion,
                ubicacion: prefijo + numero
            });
        }

    });

    return datos;
}

/* DIBUJAR EL REGISTRO COMO IMAGEN */

async function crearImagenRegistro() {

    const ancho = 1200;
    const margen = 28;
    const anchoInterior = ancho - margen * 2;
    const altoCabecera = 150;
    const altoFoto = 105;
    const altoFecha = 40;
    const altoTitulo = 55;
    const altoEncabezado = 44;
    const altoFila = 50;
    const altoBotones = 20;

    const datos = obtenerDatos();

    const altoTabla =
        altoEncabezado + Math.max(datos.length, 1) * altoFila;

    const alto =
        altoCabecera +
        altoFoto +
        altoFecha +
        altoTitulo +
        altoTabla +
        altoBotones +
        altoFoto +
        30;

    const canvas = document.createElement("canvas");
    canvas.width = ancho;
    canvas.height = alto;

    const ctx = canvas.getContext("2d");

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, ancho, alto);

    /* CABECERA */

    const gradiente = ctx.createLinearGradient(0, 0, ancho, 0);
    gradiente.addColorStop(0, "#104477");
    gradiente.addColorStop(1, "#12609c");

    ctx.fillStyle = gradiente;
    ctx.fillRect(0, 0, ancho, altoCabecera);

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 25px Arial";
    ctx.fillText("SONOCO", 28, 78);

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 36px Arial";
    ctx.fillText("CONTROL DE BARNICES", 180, 61);

    ctx.fillStyle = "#e6eff9";
    ctx.font = "24px Arial";
    ctx.fillText("REGISTRO DE UBICACIONES", 182, 95);

    ctx.fillStyle = "#bcd8f5";
    ctx.font = "15px Arial";
    ctx.fillText("By Rubén D. 268", 182, 124);

    let y = altoCabecera;

    /* CARGAR FOTOGRAFÍAS */

    async function cargarFoto(ruta) {

        return new Promise(function(resolve) {

            const img = new Image();

            img.onload = function() {
                resolve(img);
            };

            img.onerror = function() {
                resolve(null);
            };

            img.src = ruta;

        });

    }

    function dibujarFoto(img, x, yFoto, w, h) {

        if (!img) {
            return;
        }

        const escala = Math.max(
            w / img.width,
            h / img.height
        );

        const sw = w / escala;
        const sh = h / escala;

        const sx = (img.width - sw) / 2;
        const sy = (img.height - sh) / 2;

        ctx.drawImage(
            img,
            sx, sy, sw, sh,
            x, yFoto, w, h
        );

    }

    const foto1 = await cargarFoto("IMG_5503.jpeg");

    dibujarFoto(
        foto1,
        margen,
        y,
        anchoInterior,
        altoFoto
    );

    y += altoFoto + 22;

    /* FECHA */

    actualizarFecha();

    ctx.fillStyle = "#526b83";
    ctx.font = "16px Arial";

    ctx.fillText(
        "FECHA DEL REGISTRO: " +
        document.getElementById("fechaRegistro").textContent,
        margen,
        y
    );

    y += altoFecha;

    /* TÍTULO DEL REGISTRO */

    ctx.fillStyle = "#123d67";
    ctx.font = "bold 25px Arial";
    ctx.fillText("REGISTRO DE BARNICES", margen, y);

    y += 27;

    /* ENCABEZADO DE TABLA */

    ctx.fillStyle = "#e5f0ff";
    ctx.fillRect(margen, y, anchoInterior, altoEncabezado);

    ctx.fillStyle = "#234a72";
    ctx.font = "bold 16px Arial";

    ctx.fillText(
        "DESCRIPCIÓN / BARNIZ",
        margen + 12,
        y + 28
    );

    ctx.fillText(
        "UBICACIÓN",
        margen + anchoInterior * 0.63 + 12,
        y + 28
    );

    y += altoEncabezado;

    /* FILAS */

    const cantidad = Math.max(datos.length, 1);

    for (let i = 0; i < cantidad; i++) {

        const dato = datos[i] || {
            descripcion: "",
            ubicacion: ""
        };

        ctx.fillStyle = i % 2 === 0 ? "#ffffff" : "#f7f9fd";

        ctx.fillRect(
            margen,
            y,
            anchoInterior,
            altoFila
        );

        ctx.strokeStyle = "#dce5ef";
        ctx.lineWidth = 1;

        ctx.strokeRect(
            margen,
            y,
            anchoInterior,
            altoFila
        );

        ctx.fillStyle = "#203b56";
        ctx.font = "17px Arial";

        ctx.fillText(
            dato.descripcion,
            margen + 12,
            y + 31
        );

        ctx.fillStyle = "#123d67";
        ctx.font = "bold 17px Arial";

        ctx.fillText(
            dato.ubicacion,
            margen + anchoInterior * 0.63 + 12,
            y + 31
        );

        y += altoFila;

    }

    y += 20;

    /* SEGUNDA FOTO SIN TEXTO */

    const foto2 = await cargarFoto("IMG_5504.jpeg");

    dibujarFoto(
        foto2,
        margen,
        y,
        anchoInterior,
        altoFoto
    );

    return canvas;
}

/* DESCARGAR IMAGEN */

async function descargarRegistro() {

    try {

        const canvas = await crearImagenRegistro();

        const enlace = document.createElement("a");

        enlace.download = "control-barnices.png";
        enlace.href = canvas.toDataURL("image/png");

        enlace.click();

    } catch (error) {

        alert("No se pudo crear la imagen. Inténtalo de nuevo.");

    }

}

/* COMPARTIR REGISTRO */

async function compartirRegistro() {

    try {

        const canvas = await crearImagenRegistro();

        const blob = await new Promise(function(resolve) {
            canvas.toBlob(resolve, "image/png");
        });

        if (!blob) {
            throw new Error("No se pudo generar la imagen");
        }

        const archivo = new File(
            [blob],
            "control-barnices.png",
            { type: "image/png" }
        );

        if (
            navigator.share &&
            navigator.canShare &&
            navigator.canShare({ files: [archivo] })
        ) {

            await navigator.share({
                files: [archivo],
                title: "Control de barnices"
            });

        } else {

            const url = URL.createObjectURL(blob);
            const enlace = document.createElement("a");

            enlace.href = url;
            enlace.download = "control-barnices.png";
            enlace.click();

            setTimeout(function() {
                URL.revokeObjectURL(url);
            }, 3000);

            alert(
                "La imagen se ha descargado. " +
                "Puedes abrirla en Fotos y compartirla por WhatsApp."
            );

        }

    } catch (error) {

        if (error.name !== "AbortError") {
            alert(
                "No se pudo compartir el registro. " +
                "Prueba con GUARDAR IMAGEN."
            );
        }

    }

}

/* LIMPIAR REGISTRO */

function limpiarRegistro() {

    const confirmar = confirm(
        "¿Quieres borrar todas las filas del registro?"
    );

    if (!confirmar) {
        return;
    }

    document.getElementById("filas").innerHTML = "";

    for (let i = 0; i < 4; i++) {
        anadirFila(false);
    }

    actualizarFecha();

}

/* ACTUALIZAR FECHA AL VOLVER A LA APP */

document.addEventListener("visibilitychange", function() {

    if (!document.hidden) {
        actualizarFecha();
    }

});

</script>

</body>
</html>
