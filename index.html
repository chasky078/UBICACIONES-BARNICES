<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#194f7d">
<title>CONTROL DE BARNICES | SONOCO</title>

<style>
:root {
    --azul: #194f7d;
    --azul-oscuro: #123c60;
    --azul-claro: #e7f0fa;
    --borde: #cbd8e6;
    --rojo: #d71930;
    --fondo: #edf2f8;
    --texto: #243447;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 18px 12px 30px;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--fondo);
    color: var(--texto);
}

.app {
    width: 100%;
    max-width: 760px;
    margin: auto;
    background: white;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 5px 25px rgba(22, 57, 89, .12);
}

.cabecera {
    background: linear-gradient(120deg, #174a76, #216c9b);
    color: white;
    padding: 25px 20px 22px;
    display: flex;
    align-items: center;
    gap: 18px;
    min-height: 155px;
}

.logo {
    width: 118px;
    max-width: 34%;
    height: auto;
    object-fit: contain;
    background: white;
    border-radius: 5px;
    padding: 5px;
}

.separador {
    width: 3px;
    min-width: 3px;
    align-self: stretch;
    background: rgba(255,255,255,.7);
}

.titulos {
    flex: 1;
    min-width: 0;
}

.titulos h1 {
    font-size: clamp(20px, 4.5vw, 30px);
    line-height: 1.12;
    margin: 0 0 10px;
}

.titulos p {
    margin: 0;
    font-size: 15px;
    font-weight: bold;
    line-height: 1.4;
}

.firma {
    margin-top: 17px;
    text-align: right;
    font-size: 14px;
    color: #c8ddf1;
    font-weight: bold;
}

.contenido {
    padding: 20px;
}

.fecha-caja {
    border: 2px solid var(--borde);
    background: #f5f8fc;
    border-radius: 12px;
    padding: 15px 10px;
    text-align: center;
    margin-bottom: 28px;
}

.fecha {
    font-size: 19px;
    font-weight: bold;
    color: var(--azul);
}

.hora {
    margin-top: 5px;
    font-size: 16px;
    color: #526579;
}

.foto {
    display: block;
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 9px;
    border: 2px solid #d6e0eb;
    margin: 0 0 22px;
}

.tabla-contenedor {
    width: 100%;
    border: 3px solid var(--azul);
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 22px;
}

.tabla {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
}

.tabla th {
    background: var(--azul-claro);
    color: #24496d;
    padding: 15px 5px;
    font-size: 14px;
    font-weight: 800;
    border-bottom: 3px solid var(--azul);
    border-right: 3px solid var(--azul);
    line-height: 1.3;
}

.tabla th:last-child {
    border-right: none;
}

.tabla td {
    padding: 9px 6px;
    height: 91px;
    border-bottom: 2px solid var(--borde);
    border-right: 5px solid var(--azul);
    vertical-align: middle;
    background: white;
}

.tabla td:last-child {
    border-right: none;
}

.tabla tr:last-child td {
    border-bottom: none;
}

.col-descripcion {
    width: 57%;
}

.col-aviso {
    width: 15%;
}

.col-ubicacion {
    width: 28%;
}

.entrada {
    display: block;
    width: 100%;
    min-width: 0;
    height: 60px;
    border: 2px solid #d6e0eb;
    border-radius: 7px;
    padding: 8px;
    font-size: 16px;
    background: white;
    color: var(--texto);
    outline: none;
}

.entrada:focus {
    border-color: #3980b8;
    box-shadow: 0 0 0 2px rgba(57,128,184,.12);
}

.descripcion {
    text-transform: uppercase;
}

.ubicacion {
    text-align: center;
    font-weight: bold;
    font-size: 20px;
}

.aviso-celda {
    text-align: center;
    padding: 5px 2px !important;
}

.aviso {
    width: 48px;
    height: 48px;
    border: 2px solid #ccd5df;
    border-radius: 50%;
    background: white;
    padding: 7px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

.aviso-interior {
    width: 100%;
    height: 100%;
    border: 3px solid #bdc9d7;
    border-radius: 50%;
    background: #fff;
}

.aviso.activo {
    border-color: #ed9ba5;
    background: #fff1f2;
}

.aviso.activo .aviso-interior {
    background: var(--rojo);
    border-color: #b80e23;
    box-shadow: inset 0 2px 3px rgba(0,0,0,.15);
}

.eliminar {
    display: block;
    margin: 6px auto 0;
    border: 1px solid #f0b7bd;
    background: #fff0f1;
    color: #b51f2e;
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    min-height: 29px;
}

.leyenda {
    background: #fff6f6;
    border: 2px solid #efc2c7;
    border-left: 7px solid var(--rojo);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 22px;
    line-height: 1.55;
    font-size: 15px;
}

.leyenda-titulo {
    display: flex;
    align-items: center;
    gap: 9px;
    color: #ad1f2c;
    font-size: 17px;
    font-weight: 800;
    margin-bottom: 8px;
}

.punto-rojo {
    width: 25px;
    height: 25px;
    display: inline-block;
    flex: 0 0 25px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ff6868, #d71930 65%, #a90016);
    border: 1px solid #b60e20;
}

.botones {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 24px;
}

.boton {
    border: none;
    border-radius: 12px;
    min-height: 70px;
    padding: 12px 9px;
    font-size: 15px;
    font-weight: 800;
    line-height: 1.35;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

.boton:active {
    transform: scale(.98);
}

.boton-primario {
    color: white;
    background: var(--azul);
}

.boton-secundario {
    color: #24496d;
    background: #e7eff9;
}

.boton-peligro {
    color: #b51f2e;
    background: #fff0f1;
}

.foto-inferior {
    margin-top: 0;
    margin-bottom: 0;
}

.estado {
    margin-top: 12px;
    font-size: 13px;
    text-align: center;
    color: #526579;
}

@media (max-width: 430px) {
    body {
        padding: 10px 6px 22px;
    }

    .contenido {
        padding: 13px;
    }

    .cabecera {
        padding: 19px 12px;
        gap: 12px;
    }

    .logo {
        width: 94px;
    }

    .titulos p {
        font-size: 12px;
    }

    .firma {
        font-size: 12px;
    }

    .foto {
        height: 155px;
    }

    .tabla th {
        font-size: 12px;
        padding: 13px 3px;
    }

    .tabla td {
        padding: 7px 4px;
        height: 83px;
    }

    .entrada {
        height: 54px;
        padding: 5px;
        font-size: 15px;
    }

    .ubicacion {
        font-size: 19px;
    }

    .aviso {
        width: 43px;
        height: 43px;
        padding: 6px;
    }

    .eliminar {
        font-size: 11px;
        padding: 5px 3px;
    }

    .boton {
        font-size: 13px;
        min-height: 65px;
    }
}

/* Formato de la imagen exportada */
@media print {
    body {
        background: white;
        padding: 0;
    }

    .app {
        box-shadow: none;
    }

    .botones,
    .eliminar,
    .estado {
        display: none !important;
    }
}
</style>
</head>

<body>

<div class="app" id="registro">

    <header class="cabecera">
        <img
            id="logoSonoco"
            class="logo"
            src="IMG_5518.jpeg"
            alt="SONOCO"
        >

        <div class="separador"></div>

        <div class="titulos">
            <h1>CONTROL DE BARNICES</h1>
            <p>REGISTRO DE UBICACIONES</p>
            <div class="firma">By Rubén D. 268</div>
        </div>
    </header>

    <main class="contenido">

        <section class="fecha-caja">
            <div class="fecha" id="fecha">--</div>
            <div class="hora" id="hora">--:--</div>
        </section>

        <img
            class="foto"
            id="fotoSuperior"
            src="IMG_5503.jpeg"
            alt="Ubicaciones de barnices"
        >

        <div class="tabla-contenedor">
            <table class="tabla">
                <colgroup>
                    <col class="col-descripcion">
                    <col class="col-aviso">
                    <col class="col-ubicacion">
                </colgroup>

                <thead>
                    <tr>
                        <th>DESCRIPCIÓN / BARNIZ</th>
                        <th>AVISO</th>
                        <th>UBICACIÓN</th>
                    </tr>
                </thead>

                <tbody id="filas"></tbody>
            </table>
        </div>

        <section class="leyenda">
            <div class="leyenda-titulo">
                <span class="punto-rojo"></span>
                <span>AVISO DE TRASVASE</span>
            </div>

            Marca con el símbolo rojo los barnices que requieren un
            trasvase de producto debido a su bajo nivel de contenido.
        </section>

        <section class="botones">
            <button class="boton boton-primario" id="btnAnadir">
                + AÑADIR FILA
            </button>

            <button class="boton boton-secundario" id="btnCompartir">
                COMPARTIR REGISTRO
            </button>

            <button class="boton boton-secundario" id="btnGuardar">
                GUARDAR IMAGEN
            </button>

            <button class="boton boton-peligro" id="btnLimpiar">
                LIMPIAR REGISTRO
            </button>
        </section>

        <img
            class="foto foto-inferior"
            id="fotoInferior"
            src="IMG_5504.jpeg"
            alt="Estanterías de barnices"
        >

        <div class="estado" id="estado"></div>

    </main>
</div>

<script>
"use strict";

/* Ubicaciones predeterminadas de los barnices */
const UBICACIONES = {
    "814449": "W02008",
    "MKB113T": "W02009",
    "818083": "W02007",
    "110496": "W02010",
    "DISOLVENTE": "W02006",
    "MKW1301T": "W02005",
    "450148": "W02004",
    "816621": "W02003",
    "814509": "W02002"
};

const filas = document.getElementById("filas");
const estado = document.getElementById("estado");

function normalizar(texto) {
    return String(texto || "")
        .trim()
        .toUpperCase()
        .replace(/[.\s-]/g, "");
}

/* Fecha y hora automáticas. Sin calendario ni selector. */
function actualizarFechaHora() {
    const ahora = new Date();

    document.getElementById("fecha").textContent =
        new Intl.DateTimeFormat("es-ES", {
            day: "2-digit",
            month: "long",
            year: "numeric"
        }).format(ahora);

    document.getElementById("hora").textContent =
        "Hora: " +
        new Intl.DateTimeFormat("es-ES", {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false
        }).format(ahora);
}

actualizarFechaHora();
setInterval(actualizarFechaHora, 1000);

/* Crear una fila con su botón para eliminarla */
function anadirFila(descripcion = "", ubicacion = "", avisoActivo = false) {
    const tr = document.createElement("tr");

    const tdDescripcion = document.createElement("td");
    const inputDescripcion = document.createElement("input");

    inputDescripcion.type = "text";
    inputDescripcion.className = "entrada descripcion";
    inputDescripcion.placeholder = "Barniz...";
    inputDescripcion.autocomplete = "off";
    inputDescripcion.setAttribute("aria-label", "Descripción del barniz");
    inputDescripcion.value = descripcion;

    tdDescripcion.appendChild(inputDescripcion);

    const tdAviso = document.createElement("td");
    tdAviso.className = "aviso-celda";

    const botonAviso = document.createElement("button");
    botonAviso.type = "button";
    botonAviso.className = "aviso";
    botonAviso.setAttribute("aria-label", "Activar o quitar aviso de trasvase");
    botonAviso.setAttribute("aria-pressed", avisoActivo ? "true" : "false");

    const interiorAviso = document.createElement("span");
    interiorAviso.className = "aviso-interior";
    botonAviso.appendChild(interiorAviso);

    if (avisoActivo) {
        botonAviso.classList.add("activo");
    }

    botonAviso.addEventListener("click", () => {
        const activo = botonAviso.classList.toggle("activo");
        botonAviso.setAttribute("aria-pressed", activo ? "true" : "false");
    });

    tdAviso.appendChild(botonAviso);

    const tdUbicacion = document.createElement("td");
    const inputUbicacion = document.createElement("input");

    inputUbicacion.type = "text";
    inputUbicacion.className = "entrada ubicacion";
    inputUbicacion.autocomplete = "off";
    inputUbicacion.setAttribute("aria-label", "Ubicación");
    inputUbicacion.value = ubicacion;

    /* Mantiene el texto de ubicación tal como lo escriba el usuario.
       No añade prefijos ni números automáticos. */
    inputUbicacion.addEventListener("input", () => {
        inputUbicacion.value = inputUbicacion.value
            .toUpperCase()
            .replace(/[^A-Z0-9]/g, "");
    });

    tdUbicacion.appendChild(inputUbicacion);

    tr.appendChild(tdDescripcion);
    tr.appendChild(tdAviso);
    tr.appendChild(tdUbicacion);

    filas.appendChild(tr);

    /* Solo completar automáticamente cuando se reconoce un barniz. */
    function actualizarUbicacion() {
        const clave = normalizar(inputDescripcion.value);

        if (!clave) {
            inputUbicacion.value = "";
            return;
        }

        if (Object.prototype.hasOwnProperty.call(UBICACIONES, clave)) {
            inputUbicacion.value = UBICACIONES[clave];
        }
    }

    inputDescripcion.addEventListener("input", actualizarUbicacion);
    inputDescripcion.addEventListener("change", actualizarUbicacion);

    if (descripcion) {
        actualizarUbicacion();

        /* Si la ubicación se indicó expresamente, se conserva para
           descripciones que no estén en el listado. */
        if (!Object.prototype.hasOwnProperty.call(
            UBICACIONES,
            normalizar(descripcion)
        )) {
            inputUbicacion.value = ubicacion;
        }
    }

    return tr;
}

/* Cuatro filas iniciales */
for (let i = 0; i < 4; i++) {
    anadirFila();
}

document.getElementById("btnAnadir").addEventListener("click", () => {
    const nueva = anadirFila();
    nueva.querySelector(".descripcion").focus();
});

/* Eliminar una fila concreta: pulsar su botón ELIMINAR */
function actualizarBotonesEliminar() {
    /* Se añade un botón propio por fila, sin cambiar las tres columnas. */
    Array.from(filas.querySelectorAll("tr")).forEach((tr) => {
        let boton = tr.querySelector(".eliminar");

        if (!boton) {
            boton = document.createElement("button");
            boton.type = "button";
            boton.className = "eliminar";
            boton.textContent = "ELIMINAR";
            boton.addEventListener("click", () => {
                tr.remove();
            });
            tr.cells[0].appendChild(boton);
        }
    });
}

/* Crear los botones de eliminación de las filas iniciales y nuevas */
const observadorFilas = new MutationObserver(() => {
    actualizarBotonesEliminar();
});

observadorFilas.observe(filas, { childList: true });

actualizarBotonesEliminar();

/* Limpiar el registro sin guardar historial */
document.getElementById("btnLimpiar").addEventListener("click", () => {
    if (!confirm("¿Quieres limpiar todas las filas del registro?")) {
        return;
    }

    filas.innerHTML = "";

    for (let i = 0; i < 4; i++) {
        anadirFila();
    }

    actualizarBotonesEliminar();
    estado.textContent = "Registro limpio.";
});

/* Dibujar una imagen completa del registro */
async function crearImagen() {
    const escala = 2;
    const ancho = 1100;
    const margen = 40;
    const anchoInterior = ancho - margen * 2;

    const datos = Array.from(filas.querySelectorAll("tr")).map((tr) => ({
        descripcion: tr.querySelector(".descripcion").value,
        ubicacion: tr.querySelector(".ubicacion").value,
        aviso: tr.querySelector(".aviso").classList.contains("activo")
    }));

    const logo = await cargarImagen("IMG_5518.jpeg");
    const foto1 = await cargarImagen("IMG_5503.jpeg");
    const foto2 = await cargarImagen("IMG_5504.jpeg");

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    const altoCabecera = 230;
    const altoFecha = 95;
    const altoFoto = 230;
    const altoTituloTabla = 70;
    const altoFila = 115;
    const altoLeyenda = 125;
    const altoFinal = 55;

    const alto =
        margen * 2 +
        altoCabecera +
        altoFecha +
        altoFoto * 2 +
        altoTituloTabla +
        datos.length * altoFila +
        altoLeyenda +
        altoFinal;

    canvas.width = ancho * escala;
    canvas.height = alto * escala;
    ctx.scale(escala, escala);

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, ancho, alto);

    let y = margen;

    /* Cabecera */
    const gradiente = ctx.createLinearGradient(0, y, ancho, y + altoCabecera);
    gradiente.addColorStop(0, "#174a76");
    gradiente.addColorStop(1, "#216c9b");
    ctx.fillStyle = gradiente;
    ctx.fillRect(0, y, ancho, altoCabecera);

    if (logo) {
        dibujarImagenContenida(
            ctx, logo, margen + 20, y + 40, 185, 145
        );
    } else {
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 32px Arial";
        ctx.fillText("SONOCO", margen + 20, y + 110);
    }

    ctx.fillStyle = "rgba(255,255,255,.75)";
    ctx.fillRect(margen + 225, y + 30, 3, 165);

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 37px Arial";
    ctx.fillText("CONTROL DE", margen + 260, y + 78);
    ctx.fillText("BARNICES", margen + 260, y + 122);

    ctx.font = "bold 21px Arial";
    ctx.fillText("REGISTRO DE UBICACIONES", margen + 260, y + 158);

    ctx.textAlign = "right";
    ctx.fillStyle = "#c8ddf1";
    ctx.font = "bold 19px Arial";
    ctx.fillText("By Rubén D. 268", ancho - margen - 25, y + 202);
    ctx.textAlign = "left";

    y += altoCabecera + 20;

    /* Fecha y hora */
    ctx.fillStyle = "#f5f8fc";
    ctx.fillRect(margen, y, anchoInterior, altoFecha);
    ctx.strokeStyle = "#cbd8e6";
    ctx.lineWidth = 2;
    ctx.strokeRect(margen, y, anchoInterior, altoFecha);

    ctx.fillStyle = "#194f7d";
    ctx.textAlign = "center";
    ctx.font = "bold 26px Arial";
    ctx.fillText(
        document.getElementById("fecha").textContent,
        ancho / 2,
        y + 38
    );

    ctx.fillStyle = "#526579";
    ctx.font = "21px Arial";
    ctx.fillText(
        document.getElementById("hora").textContent,
        ancho / 2,
        y + 70
    );
    ctx.textAlign = "left";

    y += altoFecha + 20;

    /* Primera fotografía */
    dibujarFoto(ctx, foto1, margen, y, anchoInterior, altoFoto);
    y += altoFoto + 20;

    /* Tabla */
    const x = margen;
    const anchoDescripcion = anchoInterior * 0.57;
    const anchoAviso = anchoInterior * 0.15;
    const anchoUbicacion = anchoInterior - anchoDescripcion - anchoAviso;

    ctx.fillStyle = "#e7f0fa";
    ctx.fillRect(x, y, anchoInterior, altoTituloTabla);

    ctx.strokeStyle = "#194f7d";
    ctx.lineWidth = 4;
    ctx.strokeRect(x, y, anchoInterior, altoTituloTabla);

    ctx.fillStyle = "#24496d";
    ctx.font = "bold 20px Arial";
    ctx.textAlign = "center";

    ctx.fillText(
        "DESCRIPCIÓN / BARNIZ",
        x + anchoDescripcion / 2,
        y + 43
    );

    ctx.fillText(
        "AVISO",
        x + anchoDescripcion + anchoAviso / 2,
        y + 43
    );

    ctx.fillText(
        "UBICACIÓN",
        x + anchoDescripcion + anchoAviso + anchoUbicacion / 2,
        y + 43
    );

    ctx.textAlign = "left";

    const yInicioTabla = y;

    y += altoTituloTabla;

    datos.forEach((dato) => {
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(x, y, anchoInterior, altoFila);

        ctx.strokeStyle = "#cbd8e6";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x, y + altoFila);
        ctx.lineTo(x + anchoInterior, y + altoFila);
        ctx.stroke();

        ctx.fillStyle = "#243447";
        ctx.font = "22px Arial";

        escribirTextoAjustado(
            ctx,
            dato.descripcion,
            x + 18,
            y + 43,
            anchoDescripcion - 36,
            27
        );

        /* Círculo de aviso, incluido en la imagen exportada */
        const cx = x + anchoDescripcion + anchoAviso / 2;
        const cy = y + altoFila / 2;

        ctx.beginPath();
        ctx.arc(cx, cy, 25, 0, Math.PI * 2);
        ctx.fillStyle = "#ffffff";
        ctx.fill();
        ctx.strokeStyle = dato.aviso ? "#ed9ba5" : "#ccd5df";
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(cx, cy, 16, 0, Math.PI * 2);
        ctx.fillStyle = dato.aviso ? "#d71930" : "#ffffff";
        ctx.fill();
        ctx.strokeStyle = dato.aviso ? "#b80e23" : "#bdc9d7";
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.fillStyle = "#243447";
        ctx.font = "bold 23px Arial";
        ctx.textAlign = "center";
        ctx.fillText(
            dato.ubicacion,
            x + anchoDescripcion + anchoAviso + anchoUbicacion / 2,
            y + altoFila / 2 + 8
        );
        ctx.textAlign = "left";

        y += altoFila;
    });

    /* Separadores verticales de las tres columnas */
    ctx.strokeStyle = "#194f7d";
    ctx.lineWidth = 5;

    ctx.beginPath();
    ctx.moveTo(x + anchoDescripcion, yInicioTabla);
    ctx.lineTo(x + anchoDescripcion, y);
    ctx.moveTo(x + anchoDescripcion + anchoAviso, yInicioTabla);
    ctx.lineTo(x + anchoDescripcion + anchoAviso, y);
    ctx.stroke();

    ctx.strokeStyle = "#194f7d";
    ctx.lineWidth = 4;
    ctx.strokeRect(x, yInicioTabla, anchoInterior, y - yInicioTabla);

    y += 22;

    /* Leyenda */
    ctx.fillStyle = "#fff6f6";
    ctx.fillRect(margen, y, anchoInterior, altoLeyenda);
    ctx.strokeStyle = "#efc2c7";
    ctx.lineWidth = 2;
    ctx.strokeRect(margen, y, anchoInterior, altoLeyenda);

    ctx.fillStyle = "#d71930";
    ctx.fillRect(margen, y, 8, altoLeyenda);

    ctx.fillStyle = "#ad1f2c";
    ctx.font = "bold 23px Arial";
    ctx.fillText("AVISO DE TRASVASE", margen + 28, y + 38);

    ctx.fillStyle = "#243447";
    ctx.font = "19px Arial";
    ctx.fillText(
        "Marca con el símbolo rojo los barnices que requieren un",
        margen + 28,
        y + 73
    );
    ctx.fillText(
        "trasvase de producto debido a su bajo nivel de contenido.",
        margen + 28,
        y + 101
    );

    y += altoLeyenda + 20;

    /* Segunda fotografía */
    dibujarFoto(ctx, foto2, margen, y, anchoInterior, altoFoto);

    return canvas;
}

function cargarImagen(ruta) {
    return new Promise((resolve) => {
        const img = new Image();

        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);

        img.src = ruta;
    });
}

function dibujarImagenContenida(ctx, img, x, y, w, h) {
    const escala = Math.min(w / img.width, h / img.height);
    const nw = img.width * escala;
    const nh = img.height * escala;

    ctx.drawImage(
        img,
        x + (w - nw) / 2,
        y + (h - nh) / 2,
        nw,
        nh
    );
}

function dibujarFoto(ctx, img, x, y, w, h) {
    ctx.save();

    ctx.beginPath();
    ctx.roundRect(x, y, w, h, 9);
    ctx.clip();

    ctx.fillStyle = "#edf2f8";
    ctx.fillRect(x, y, w, h);

    if (img) {
        const escala = Math.max(w / img.width, h / img.height);
        const nw = img.width * escala;
        const nh = img.height * escala;

        ctx.drawImage(
            img,
            x + (w - nw) / 2,
            y + (h - nh) / 2,
            nw,
            nh
        );
    } else {
        ctx.fillStyle = "#243447";
        ctx.font = "20px Arial";
        ctx.fillText("Fotografía no disponible", x + 20, y + h / 2);
    }

    ctx.restore();

    ctx.strokeStyle = "#cbd8e6";
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, w, h);
}

function escribirTextoAjustado(ctx, texto, x, y, anchoMax, salto) {
    const palabras = String(texto || "").split(/\s+/);
    let linea = "";
    let lineas = [];

    palabras.forEach((palabra) => {
        const prueba = linea ? linea + " " + palabra : palabra;

        if (ctx.measureText(prueba).width > anchoMax && linea) {
            lineas.push(linea);
            linea = palabra;
        } else {
            linea = prueba;
        }
    });

    if (linea) lineas.push(linea);

    lineas.slice(0, 2).forEach((lineaTexto, i) => {
        ctx.fillText(lineaTexto, x, y + i * salto);
    });
}

/* Descargar la imagen al dispositivo */
async function guardarImagen() {
    estado.textContent = "Preparando imagen...";

    try {
        const canvas = await crearImagen();

        const enlace = document.createElement("a");
        enlace.download = "CONTROL-DE-BARNICES.png";
        enlace.href = canvas.toDataURL("image/png");
        enlace.click();

        estado.textContent =
            "Imagen preparada. Comprueba las descargas o Fotos del dispositivo.";
    } catch (error) {
        console.error(error);
        estado.textContent =
            "No se pudo crear la imagen. Comprueba las fotografías de GitHub.";
        alert("No se pudo generar la imagen del registro.");
    }
}

document.getElementById("btnGuardar").addEventListener("click", guardarImagen);

/* Compartir mediante el menú de compartir del móvil */
document.getElementById("btnCompartir").addEventListener("click", async () => {
    estado.textContent = "Preparando registro para compartir...";

    try {
        const canvas = await crearImagen();

        const blob = await new Promise((resolve) => {
            canvas.toBlob(resolve, "image/png");
        });

        if (!blob) {
            throw new Error("No se pudo generar la imagen");
        }

        const archivo = new File(
            [blob],
            "CONTROL-DE-BARNICES.png",
            { type: "image/png" }
        );

        if (
            navigator.share &&
            navigator.canShare &&
            navigator.canShare({ files: [archivo] })
        ) {
            await navigator.share({
                files: [archivo],
                title: "Control de barnices",
                text: "Registro de ubicaciones de barnices."
            });

            estado.textContent = "Menú de compartir abierto.";
        } else {
            const url = URL.createObjectURL(blob);
            const enlace = document.createElement("a");
            enlace.href = url;
            enlace.download = "CONTROL-DE-BARNICES.png";
            enlace.click();

            setTimeout(() => URL.revokeObjectURL(url), 3000);

            estado.textContent =
                "Imagen descargada. Ábrela y compártela por WhatsApp.";
        }
    } catch (error) {
        if (error.name === "AbortError") {
            estado.textContent = "";
            return;
        }

        console.error(error);
        estado.textContent = "No se pudo compartir el registro.";
        alert("No se pudo compartir. Prueba con GUARDAR IMAGEN.");
    }
});
</script>
